<!DOCTYPE html>
<!--
  Baldur Admin Web Console.

  Self-contained: inline <style> and <script> only — no third-party scripts,
  no external assets (the zero-new-runtime-dependency constraint), which is
  also why the two embedded typefaces are registered from bytes rather than
  fetched. Served by the stdlib admin server at GET /. The handler
  (console/handler.py) substitutes three per-request placeholders before
  serving:
    - the v1.0 PRO panel-visibility map, into window.__BALDUR_PANELS__
    - the non-gating entitlement status string
    - the per-request CSP nonce on every <script> tag

  Structure, top to bottom: a one-line triage verdict, then the rows that need
  attention (each expanding in place), then a compact System table for the
  rest. Every row is one check — one per PANELS entry, plus one per application
  service the circuit-breaker status returns.

  All API JSON is rendered with textContent (never innerHTML) — DOM-XSS safe.
  A global error boundary keeps one row's failure from blanking the console.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Baldur Admin Console</title>
  <style>
    :root {
      /* Instrument principle: achromatic chrome, state-only color. The former
         dawn-gold brand micro-marks are retired — the wordmark is plain text,
         and the surviving locator marks (:focus-visible ring, row flash) use
         the achromatic --mark — so hue means state severity and nothing else.
         The state set is the two-hue data family shared with the baldur.sh
         landing (--ember fail / --moss heal / --open neutral series), so site
         and console read as one system. --amber is the console's own
         attention-tier mark for a degraded-but-absorbing domain; it never
         appears on the landing and is never a chart series. */
      --ink: #0a0b0d; --ink2: #0f1013; --ink3: #121317; --line: #1e2026;
      --bone: #d8dce3; --ash: #7e8695; --ash2: #4c525e;
      --mark: #f0f2f5;
      --ember: #e05561; --moss: #6fb5a0; --amber: #fbad37; --open: #778092;
      --ember-tint: rgba(224,85,97,.10); --moss-tint: rgba(111,181,160,.08);
      --amber-tint: rgba(251,173,55,.10);
      /* Both faces are registered from bytes by the script below (see the
         FontFace block) — the stacks degrade to the system faces if that
         registration ever fails. Mono is reserved for data tokens (ids,
         counts, timestamps, paths); prose uses the display face. */
      --display: "Schibsted Grotesk", -apple-system, BlinkMacSystemFont,
                 "Segoe UI", Roboto, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, "Cascadia Code", "SF Mono",
              Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--ink); color: var(--bone);
      font: 14px/1.5 var(--display);
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 1240px; margin: 0 auto; padding: 0 32px; }
    .topbar {
      border-bottom: 1px solid var(--line); background: var(--ink);
      position: sticky; top: 0; z-index: 10;
    }
    .topbar-inner {
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px; padding: 12px 0;
    }
    /* Wordmark: "BALDUR" + a secondary context word — plain text, no mark. */
    .brand { display: flex; align-items: baseline; gap: 10px; }
    .brand .mark {
      font-weight: 700; font-size: 15px; letter-spacing: .06em; color: var(--mark);
    }
    .brand .ctx { font-size: 13px; color: var(--ash2); }
    .topbar-right {
      display: flex; align-items: center; gap: 16px; font-size: 13px;
      color: var(--ash);
    }
    /* Wall clock only. The confirmed design pairs it with a "live" marker; the
       auto-refresh toggle ships OFF, so "live" would be false on a default
       console. The per-surface age tokens state the real thing instead. */
    .clock { font: 12.5px/1 var(--mono); color: var(--ash2); }
    .key-entry { display: flex; align-items: center; gap: 6px; }
    .key-entry input {
      background: var(--ink); border: 1px solid var(--line); color: var(--bone);
      border-radius: 4px; padding: 6px 10px; width: 220px; font: inherit;
    }
    /* Buttons are the outline family: transparent + neutral hairline border for
       every button — consequence hue lives on the LABEL only (recover = moss,
       destructive = ember), with a faint tint fill on hover. The modal Confirm
       is the one fill — the dialog's primary affordance must dominate Cancel
       without spending hue. */
    button {
      background: transparent; color: var(--bone); border: 1px solid var(--line);
      border-radius: 4px; padding: 6px 12px; font: inherit; cursor: pointer;
    }
    button:hover { background: var(--ink3); }
    button.danger { color: var(--ember); }
    button.danger:hover { background: var(--ember-tint); }
    button.primary {
      background: var(--bone); color: var(--ink); border-color: var(--bone);
      font-weight: 600;
    }
    button.primary:hover { background: var(--bone); filter: brightness(0.9); }
    /* One global focus locator: visible on every focusable element. */
    :focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
    #banner {
      display: none; padding: 8px 20px; background: var(--amber-tint); color: var(--amber);
      border-bottom: 1px solid var(--line); font-size: 13px;
    }

    /* ===== Tier 1: the triage line — one sentence, then the offenders ===== */
    .triage { padding: 22px 0 6px; display: flex; align-items: baseline; gap: 12px; }
    /* Aligned to the FIRST line, not the block centre: a long verdict wraps,
       and a dot floating between two lines reads as belonging to neither. */
    .triage .dot {
      width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
      align-self: flex-start; margin-top: 10px; background: var(--ash2);
    }
    .triage.state-ok     .dot { background: var(--moss); }
    .triage.state-warn   .dot {
      background: linear-gradient(90deg, var(--amber) 0 50%, transparent 50%);
    }
    .triage.state-danger .dot {
      background: transparent; box-shadow: inset 0 0 0 2px var(--ember);
      animation: triage-pulse 1.6s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) { .triage.state-danger .dot { animation: none; } }
    .triage h1 {
      margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.01em;
      color: var(--mark);
    }
    .triage h1 .triage-detail { color: var(--ash); font-weight: 400; }
    /* nowrap: the verdict beside it wraps freely, and a two-line "as of just
       now" in the corner reads as a broken layout rather than a timestamp. */
    .triage-age {
      margin-left: auto; font: 12px/1 var(--mono); color: var(--ash2);
      white-space: nowrap;
    }
    .triage-chips { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 0 4px 21px; }
    .triage-chip {
      cursor: pointer; font: 12px/1 var(--mono); padding: 6px 11px; border-radius: 4px;
      border: 1px solid var(--line); background: var(--ink2); color: var(--bone);
      display: flex; gap: 7px; align-items: center;
    }
    .triage-chip .cdot { width: 7px; height: 7px; border-radius: 50%; }
    .triage-chip.danger .cdot { background: transparent; border: 2px solid var(--ember); }
    .triage-chip.warn .cdot {
      background: linear-gradient(90deg, var(--amber) 0 50%, transparent 50%);
    }
    .triage-chip:hover { border-color: var(--ash); }

    /* ===== Section labels shared by the attention stream and System ===== */
    .sec-label { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 12px; }
    .sec-label h2 {
      margin: 0; font-size: 14px; font-weight: 600; color: var(--bone);
      letter-spacing: .01em;
    }
    .sec-label .count { font: 12px/1 var(--mono); color: var(--ash2); }

    /* ===== Tier 2/3: rows. ONE node per check; the tier it lives in is the
       only difference, so a tier migration re-appends the same element and the
       accordion keeps its open state and its mounted drill-down. ===== */
    .stream { display: flex; flex-direction: column; gap: 10px; }
    .stream-empty { font-size: 14px; color: var(--ash); padding: 2px 0 4px; }
    .sys-table { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .row { border: 1px solid var(--line); border-radius: 10px; background: var(--ink2); }
    .sys-table .row {
      border: none; border-radius: 0; border-bottom: 1px solid var(--ink3);
      background: var(--ink2);
    }
    .sys-table .row:last-child { border-bottom: none; }
    .row.open { border-color: var(--ash2); background: var(--ink3); }
    .row-head {
      display: flex; align-items: center; gap: 14px; padding: 14px 18px;
      cursor: pointer;
    }
    .sys-table .row-head { padding: 11px 18px; }
    /* State = colour + shape, the same vocabulary the .tag glyphs use, so
       severity survives colourblindness on a 8px dot. */
    .row-head .st {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
      background: var(--ash2);
    }
    .row[data-sev="ok"]     .st { background: var(--moss); }
    .row[data-sev="warn"]   .st {
      background: linear-gradient(90deg, var(--amber) 0 50%, transparent 50%);
    }
    .row[data-sev="danger"] .st {
      background: transparent; box-shadow: inset 0 0 0 2px var(--ember);
    }
    .row[data-sev="none"]   .st {
      background: transparent; box-shadow: inset 0 0 0 1px var(--ash2);
    }
    .row-head .name { font-weight: 600; font-size: 15px; color: var(--mark); }
    .sys-table .row-head .name { font-weight: 500; min-width: 150px; font-size: 14px; }
    .row-head .desc { color: var(--ash); font-size: 14px; }
    .row-head .when {
      margin-left: auto; font: 12px/1 var(--mono); color: var(--ash2);
      white-space: nowrap;
    }
    .row-head .chev { color: var(--ash2); font-size: 11px; }
    .row-head .row-refresh { padding: 2px 7px; font-size: 12px; color: var(--ash); }
    .row-body { border-top: 1px solid var(--ink3); }
    .row.flash { outline: 2px solid var(--mark); outline-offset: 2px; }

    /* Expanded service row: label -> value facts, prose labels, mono values.
       Only fields the payload actually reports appear (isReported). */
    /* Bounded: a label and its value must stay readable as a pair, not sit
       at opposite ends of a wide viewport. */
    .facts {
      display: flex; flex-direction: column; padding: 6px 18px;
      font-size: 13.5px; max-width: 560px;
    }
    .fact {
      display: flex; justify-content: space-between; gap: 24px; padding: 7px 0;
      border-bottom: 1px solid var(--ink3);
    }
    .fact:last-child { border-bottom: none; }
    .fact .k { color: var(--ash); }
    .fact .v { font: 12.5px/1.5 var(--mono); color: var(--bone); text-align: right; }
    /* Neutral chip: achromatic by default (color-budget rule a). A severity
       class adds state color on the text + a CSS-drawn glyph; every chip keeps
       the same neutral hairline border and transparent ground (no tint fills,
       no pill radius). Booleans / non-status tokens stay quiet ash. */
    .tag {
      font-size: 11px; padding: 1px 7px; border-radius: 3px;
      background: transparent; color: var(--ash); border: 1px solid var(--line);
      text-transform: uppercase;
      /* Status badges must never break mid-word (e.g. a table cell with
         overflow-wrap:anywhere would otherwise split "PENDING"). */
      white-space: nowrap;
    }
    /* PRO tier badge: quiet ash outline, OSS badge removed. */
    .tag.pro    { color: var(--ash); }
    .tag.ok     { color: var(--moss); }
    .tag.warn   { color: var(--amber); }
    .tag.danger { color: var(--ember); }
    /* State = color + shape: 9px glyph — filled dot (ok), half (warn), hollow
       ring (danger) — so severity survives colorblindness. */
    .tag.ok::before, .tag.warn::before, .tag.danger::before {
      content: ""; display: inline-block; width: 9px; height: 9px;
      border-radius: 50%; margin-right: 5px; vertical-align: -1px;
    }
    .tag.ok::before     { background: currentColor; }
    .tag.warn::before   { background: linear-gradient(90deg, currentColor 0 50%, transparent 50%); }
    .tag.danger::before { border: 2px solid currentColor; }
    .panel-body { padding: 12px 14px; }
    pre {
      margin: 0; max-height: 240px; overflow: auto; font-size: 12px;
      font-family: var(--mono);
      color: var(--ash); white-space: pre-wrap; word-break: break-word;
    }
    /* Structured key-value render (D1) — reuses the scrollable pre container. */
    .kv-row { display: flex; gap: 8px; align-items: baseline; padding: 1px 0; }
    .kv-key { color: var(--ash); flex-shrink: 0; }
    .kv-val { color: var(--bone); word-break: break-word; }
    /* Null-field collapse: an object's null-valued fields fold to one clamped
       "not set — a · b (+N more)" line (single-line ellipsis, click to expand
       into individual rows). Deflates the null noise + panel-height variance. */
    .null-clamp {
      display: block; max-width: 100%; padding: 1px 0; border: none;
      background: transparent; color: var(--ash2); font: inherit; text-align: left;
      cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .null-clamp:hover { color: var(--ash); background: transparent; }
    .kv-null { color: var(--ash2); }
    /* DLQ drill-down (D2/D3/D5). */
    .panel-drilldown { padding: 10px 14px 12px; border-top: 1px solid var(--line); }
    .drill-age { padding: 0 14px 10px; }
    .drill-title { font-size: 12px; color: var(--ash); margin-bottom: 6px; }
    table.dlq-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.dlq-table th {
      text-align: left; color: var(--ash); font-weight: 600; padding: 4px 6px;
    }
    table.dlq-table td {
      padding: 4px 6px; border-top: 1px solid var(--line);
      /* Break long unbreakable ids (Redis composite host:pid:hash:N) so the
         cell wraps instead of widening the table past the panel and clipping
         the right-hand columns. */
      overflow-wrap: anywhere;
    }
    tr.dlq-row { cursor: pointer; }
    tr.dlq-row:hover { background: var(--ink3); }
    .dlq-pager { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    .dlq-pager button:disabled { opacity: 0.4; cursor: default; }
    .dlq-detail { margin-top: 12px; }
    /* Bounded, internally-scrollable list box — a list (DLQ entries, canary
       active rollouts, canary/DLQ history) can accumulate many rows, and a
       wrapped long id makes each row multi-line, so cap the height and scroll
       inside instead of growing the panel off the bottom of the page (mirrors
       the pre max-height pattern). Wraps the table only; a pager, if any, stays
       outside so it remains visible. */
    .list-scroll { max-height: 260px; overflow-y: auto; }
    .dlq-detail-head {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      margin-bottom: 6px;
    }
    /* DLQ filter row (#540 follow-up). */
    .dlq-filter { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
    .dlq-filter select, .dlq-filter input {
      background: var(--ink); border: 1px solid var(--line); color: var(--bone);
      border-radius: 4px; padding: 4px 8px; font: inherit; font-size: 12px;
    }
    .dlq-filter input { width: 130px; }
    /* Per-panel freshness + header auto-refresh toggle. */
    .updated { font-size: 11px; color: var(--ash); }
    .autorefresh {
      display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ash);
    }
    .panel-actions {
      display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 14px;
      border-top: 1px solid var(--line);
    }
    .notice { color: var(--ember); font-size: 12px; }
    .spinner { color: var(--ash); font-size: 12px; }
    /* Modal */
    #overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      align-items: center; justify-content: center; z-index: 100;
    }
    #modal {
      background: var(--ink2); border: 1px solid var(--line);
      border-radius: 8px; padding: 20px; width: 420px; max-width: 92vw;
    }
    #modal h3 { margin: 0 0 10px; font-size: 15px; }
    #modal p { color: var(--ash); font-size: 13px; }
    #modal .unlock-hint, #modal .action-warn {
      background: var(--amber-tint); color: var(--amber); padding: 8px 10px;
      border-radius: 6px; font-size: 12px; margin: 10px 0;
    }
    #modal input, #modal textarea, #modal select {
      width: 100%; background: var(--ink); border: 1px solid var(--line);
      color: var(--bone); border-radius: 4px; padding: 8px; font: inherit;
      margin: 6px 0;
    }
    #modal textarea { min-height: 70px; font-family: var(--mono); font-size: 12px; }
    /* Structured body-field form (bodyFields): a persistent label + help line
       per field so the explanation stays visible while typing, plus enum
       <select>s that prevent mistyped levels. */
    #modal .field-label { color: var(--bone); font-size: 13px; margin: 10px 0 2px; }
    #modal .field-help { color: var(--ash); font-size: 12px; margin: 0; }
    #modal .field-check {
      display: flex; align-items: center; gap: 6px;
      color: var(--bone); font-size: 13px; margin: 8px 0;
    }
    #modal .field-check input { width: auto; margin: 0; }
    #modal .modal-actions {
      display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px;
    }
    #modal .modal-result { font-size: 12px; margin-top: 10px; white-space: pre-wrap; }

    /* Tabular figures everywhere: counts must not jitter as they tick. */
    body { font-feature-settings: "tnum" 1; }
    @keyframes triage-pulse {
      0%, 100% { box-shadow: inset 0 0 0 2px var(--ember), 0 0 0 0 rgba(224,85,97,.55); }
      50%      { box-shadow: inset 0 0 0 2px var(--ember), 0 0 0 8px rgba(224,85,97,0); }
    }

    /* Dashboard readout (rendered inside its row body). */
    .hero-top  { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .hero-pill {
      font: 600 12px/1 var(--mono); letter-spacing: .09em; padding: 7px 13px;
      border-radius: 3px; border: 1px solid var(--line);
      text-transform: uppercase;
    }
    .hero-pill.ok     { color: var(--moss); }
    .hero-pill.warn   { color: var(--amber); }
    .hero-pill.danger { color: var(--ember); }
    .hero-pill.ok::before, .hero-pill.warn::before, .hero-pill.danger::before {
      content: ""; display: inline-block; width: 9px; height: 9px;
      border-radius: 50%; margin-right: 7px; vertical-align: -1px;
    }
    .hero-pill.ok::before     { background: currentColor; }
    .hero-pill.warn::before   { background: linear-gradient(90deg, currentColor 0 50%, transparent 50%); }
    .hero-pill.danger::before { border: 2px solid currentColor; }
    .hero-ts   { font: 11px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ash); }
    .hero-tiles{ display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
    .tile { background: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 13px 15px; }
    .tile .lbl { font: 600 10px/1 var(--mono); letter-spacing: .13em; text-transform: uppercase; color: var(--ash2); }
    .tile .num { font: 600 30px/1.1 var(--mono); margin-top: 9px; color: var(--bone); }
    .tile.warn .num   { color: var(--amber); }
    .tile.danger .num { color: var(--ember); }
    .tile.ok .num     { color: var(--moss); }
    .tile .sub { font-size: 11px; color: var(--ash); margin-top: 4px; }
    .hero-foot { margin-top: 13px; font: 12px/1.4 var(--mono); color: var(--ash); }
    .hero-foot b { color: var(--bone); font-weight: 600; }

    /* Circuit Breakers: per-service rows. The fails count is the panel's most
       operationally important number — promote it (bold primary), and fix the
       state-chip column width so chips align across rows. */
    .cb-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
    .cb-row:first-child { border-top: none; }
    .cb-name  { font: 13px/1 var(--mono); color: var(--bone); flex: 1; }
    .cb-right { display: flex; align-items: center; gap: 12px; margin-left: auto; }
    .cb-fail  { font: 13px/1 var(--mono); color: var(--ash); }
    .cb-fail b { font-size: 14px; font-weight: 600; color: var(--bone); }
    .cb-right .tag { display: inline-block; min-width: 74px; text-align: center; }

    /* DLQ stats: mini tiles per status. */
    .mini-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .mini-tile { background: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; }
    .mini-tile .lbl  { font: 600 9px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ash2); }
    .mini-tile .mnum { font: 600 20px/1.1 var(--mono); margin-top: 6px; color: var(--bone); }
    .mini-tile.warn .mnum   { color: var(--amber); }
    .mini-tile.danger .mnum { color: var(--ember); }
    .mini-tile.ok .mnum     { color: var(--moss); }
    .dlq-rec { margin-top: 9px; font: 11px/1 var(--mono); color: var(--ash); }
    .dlq-armed { margin-top: 9px; display: flex; align-items: center;
      flex-wrap: wrap; gap: 6px; }
    .dlq-armed-more { font: 11px/1.4 var(--mono); color: var(--ash); }

    /* Action buttons colored by consequence (moss = recover, ember = destructive
       reserved, neutral = routine) — hue on the label only, neutral hairline
       border, tint fill on hover. Permission gating (typed-confirm) is
       separate. */
    .panel-actions button.btn-recover { color: var(--moss); }
    .panel-actions button.btn-recover:hover { background: var(--moss-tint); }
    .panel-actions button.btn-danger  { color: var(--ember); }
    .panel-actions button.btn-danger:hover { background: var(--ember-tint); }

    /* Tables (DLQ + Canary share .dlq-table): keep code-like ids on one line and
       scroll the bounded list box horizontally instead of stacking them. */
    table.dlq-table td { white-space: nowrap; overflow-wrap: normal; }
    table.dlq-table td:first-child { font-family: var(--mono); }
    .list-scroll { overflow-x: auto; }

    /* ===== Healing ledger: the one time axis on the page ===== */
    .ledger {
      background: var(--ink2); border: 1px solid var(--line); border-radius: 10px;
      padding: 20px 24px 14px; margin-top: 18px;
    }
    .ledger-head {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 16px; flex-wrap: wrap;
      font: 12px/1.4 var(--mono); color: var(--ash); margin-bottom: 14px;
    }
    .ledger-head b { color: var(--bone); font-weight: 500; }
    .legend { display: flex; gap: 20px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .dot-sq { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
    .dot-sq.fail { background: var(--ember); }
    .dot-sq.heal { background: var(--moss); }
    .dot-sq.open { background: var(--open); }
    .ledger-plot { position: relative; }
    .ledger-plot svg { display: block; width: 100%; height: auto; }
    .ledger-plot text.lg-axis { fill: var(--ash2); font-size: 10px; }
    .ledger-state { padding: 40px 0; text-align: center; color: var(--ash); font-size: 13px; }
    /* Instant feedback: the tooltip follows the cursor with no transition and
       no animation — a chart that lags the pointer reads as a picture. */
    .ledger-tip {
      position: absolute; pointer-events: none; display: none;
      background: var(--ink3); border: 1px solid var(--line); border-radius: 6px;
      padding: 7px 10px; font: 11px/1.5 var(--mono); color: var(--bone);
      white-space: pre; z-index: 5;
    }
    .ledger-caption {
      margin-top: 10px; font: 11.5px/1.6 var(--mono); color: var(--ash2);
    }
    .ledger-foot {
      display: flex; gap: 30px; flex-wrap: wrap;
      border-top: 1px solid var(--ink3); margin-top: 10px; padding-top: 12px;
      font: 12.5px/1 var(--mono); color: var(--ash);
    }
    .ledger-foot b { color: var(--bone); font-weight: 500; }

    @media (max-width: 719px) {
      .wrap { padding: 0 16px; }
      .row-head { flex-wrap: wrap; gap: 8px; }
      .row-head .when { margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <span class="mark">BALDUR</span>
        <span class="ctx">admin console</span>
      </div>
      <div class="topbar-right">
        <span class="clock" id="clock"></span>
        <label class="autorefresh">
          <input type="checkbox" id="autorefresh-toggle" /> Auto-refresh
        </label>
        <div class="key-entry">
          <label for="admin-key" class="spinner">Admin key</label>
          <input id="admin-key" type="password" autocomplete="off"
                 placeholder="paste key (non-localhost)" />
          <button id="save-key">Save</button>
        </div>
      </div>
    </div>
  </div>

  <div id="banner"></div>

  <div class="wrap">
    <!-- Tier 1: the verdict. One sentence, then jump-to-row offender chips. -->
    <div class="triage" id="triage">
      <span class="dot"></span>
      <h1><span class="triage-lead"></span> <span class="triage-detail"></span></h1>
      <span class="triage-age updated"></span>
    </div>
    <div class="triage-chips" id="triage-chips"></div>

    <!-- The one time axis: what failed, what healed, and how much stayed open.
         Derived client-side from the existing DLQ + summary reads. -->
    <div class="ledger" id="ledger">
      <div class="ledger-head">
        <span><b>healing ledger</b><span id="ledger-window"></span></span>
        <div class="legend">
          <span><i class="dot-sq fail"></i>failures</span>
          <span><i class="dot-sq heal"></i>heals</span>
          <!-- NOT "open": the same screen shows breakers whose state IS open,
               and the line means something else entirely — failures that have
               not been healed yet. One word, two meanings, one viewport. -->
          <span><i class="dot-sq open"></i>still unhealed</span>
        </div>
      </div>
      <div class="ledger-plot" id="ledger-plot">
        <div class="ledger-state">Loading…</div>
      </div>
      <div class="ledger-caption" id="ledger-caption"></div>
      <div class="ledger-caption updated" id="ledger-age"></div>
      <div class="ledger-foot" id="ledger-foot"></div>
    </div>

    <!-- Tier 2: what needs attention, each row expanding in place. -->
    <div class="sec-label">
      <h2>Needs attention</h2><span class="count" id="attention-count"></span>
    </div>
    <div class="stream-empty" id="attention-empty"></div>
    <div class="stream" id="attention"></div>

    <!-- Tier 3: everything else, one compact line each. -->
    <div class="sec-label"><h2>System</h2><span class="count" id="system-count"></span></div>
    <div class="sys-table" id="system-rows"></div>
    <div style="height: 40px"></div>
  </div>

  <div id="overlay">
    <div id="modal" role="dialog" aria-modal="true">
      <h3 id="modal-title"></h3>
      <div id="modal-content"></div>
      <div class="modal-actions">
        <button id="modal-cancel">Cancel</button>
        <button id="modal-confirm" class="primary">Confirm</button>
      </div>
      <div id="modal-result" class="modal-result"></div>
    </div>
  </div>

  <!-- Server-injected bootstrap data (D8/D9/D12). -->
  <script nonce="__BALDUR_CSP_NONCE__">
    window.__BALDUR_PANELS__ = __BALDUR_PANELS_JSON__;
    window.__BALDUR_ENTITLEMENT__ = "__BALDUR_ENTITLEMENT__";
  </script>

  function showGlobalError(where, message) {
    var banner = document.getElementById("banner");
    banner.style.display = "block";
    banner.textContent =
      "Console internal error" + (where ? " (" + where + ")" : "") +
      ": " + message + " — other panels remain usable.";

  window.addEventListener("error", function (e) {
    showGlobalError("", (e && e.message) || "script error");
  });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e && e.reason;
    showGlobalError("", (r && r.message) || String(r) || "promise rejection");
  });

  // The console is used precisely when the system may be wedged, so every

  var FETCH_TIMEOUT_MS = 5000;
  function adminFetch(path, opts) {
    opts = opts || {};
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, FETCH_TIMEOUT_MS);
    var headers = Object.assign({}, opts.headers || {});
    var key = getKey();
    if (key) { headers["X-Baldur-Admin-Key"] = key; }
    return fetch(path, Object.assign({}, opts, {
      headers: headers, signal: controller.signal
    })).finally(function () { clearTimeout(timer); });
  }
