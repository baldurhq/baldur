      listBox.appendChild(box);
    }

    function load() {
      fetchInto(listBox, "/config/editable", function (data) {
        rolloutLocks = (data && data.rollout_locks) || {};
        renderPending(data || {});
        renderList(data || {});
      });
    }

    load();
  }

  // String-keyed drill-down dispatch (550 D3) — resolved after both drill-down
  // functions are declared. A panel's `drilldown: "<key>"` selects its
  // renderer; buildPanel looks it up rather than calling one hardcoded function.
  var DRILLDOWNS = {
    dlq: renderDlqDrilldown,
    canary: renderCanaryDrilldown,
    runtime_config: renderRuntimeConfigDrilldown
  };

  // Bespoke panel-body renderers (bodyRender: "<key>"), resolved by loadPanel
  // when the generic key->value dump renders a status shape poorly.
  var BODY_RENDERERS = {
    dashboard: renderDashboardHero,
    circuit_breaker: renderCircuitBreakers,
    dlq_stats: renderDlqStats,
    canary_summary: renderCanarySummary,
    meta_watchdog: renderMetaWatchdog,
    runtime_config: renderRuntimeConfig
  };

  // --- Row prose: one sentence per row, from what the payload REPORTS -------
  // A key->value dump makes the operator do the diagnosis. These describers do
  // it instead — but they may only state what their own status payload
  // actually carries. A clause whose value is unreported DROPS; it never
  // becomes "unknown", "0" or an asserted condition, and a describer with
  // nothing to say returns "" so the row renders its name and state alone.
  // Every one is a pure function of the payload (no DOM, no row state).
  //
  // Sentences are static English with interpolated data tokens, so the copy is
  // translatable in one place instead of scattered through six renderers.
  var DESCRIBERS = {
    dashboard: function (d) {
      // The three zeros are "reported" by the letter of isReported, so the
      // reported-fields-only rule cannot save this row on its own: a Null
      // statistics adapter reports them, every time, on the shipped OSS
      // install. Printing them under a ledger that is drawing entries states a
      // number the operator can see is wrong, one row below the strip that
      // already defends itself by taking max(reported, window-derived).
      if (summaryDisagreesWithWindow(d)) {
        // Observation first, cause second, and the cause names the thing an
        // operator can actually go and check. The longer form this replaced
        // ("the statistics source reports an empty store (unconfigured, or
        // lagging behind its cache)") described the payload rather than the
        // fix, which is a sentence the reader has to translate before acting.
        return "totals disagree with the DLQ window"
          + " — no statistics adapter is reporting, or its cache is stale";
      }
      var ov = (d && d.overview) || {};
      var ra = (d && d.recent_activity) || {};
      var parts = [];
      if (isReported(ov.pending)) { parts.push(ov.pending + " awaiting heal"); }
      if (isReported(ov.failed)) { parts.push(ov.failed + " unrecovered"); }
      if (isReported(ra.resolved_24h)) { parts.push(ra.resolved_24h + " healed in 24 h"); }
      return parts.join(" · ");
    },
    // The controls row. It does NOT restate per-service trouble: every service
    // in the list has its own row above, carrying its own state and severity,
    // so a summary here would say the same thing a second time in a tier the
    // operator is not scanning for trouble.
    circuit_breaker: function (d) {
      var services = d && d.services;
      if (!Array.isArray(services)) { return ""; }
      if (!services.length) {
        // Never "all services healthy" — the store simply has no record yet.
        return "no breaker state on record — the controls below take a service name";
      }
      return services.length + (services.length === 1 ? " service" : " services")
        + " tracked — each has its own row above";
    },
    system: function (d) {
      d = d || {};
      if (d.status === "disabled" || d.enabled === false) {
        var stopped = "automation is stopped — the kill switch is engaged, "
          + "so nothing is being healed";
        if (isReported(d.disabled_reason)) { stopped += ": " + d.disabled_reason; }
        return stopped;
      }
      if (d.dry_run === true) {
        return "dry-run — failures are observed and logged, no action is taken";
      }
      if (d.status === "enabled" || d.enabled === true) { return "automation enabled"; }
      return "";
    },
    dlq: function (d) {
      d = d || {};
      var bs = d.by_status || {};
      var parked = (bs.pending || 0) + (bs.requires_review || 0)
        + (bs.reviewing || 0) + (bs.replaying || 0);
      var lost = (bs.permanently_failed || 0) + (bs.rejected || 0);
      var parts = [];
      if (isReported(d.total)) {
        parts.push(d.total + (d.total === 1 ? " entry" : " entries"));
      }
      if (parked) { parts.push(parked + " parked awaiting replay"); }
      if (lost) { parts.push(lost + " past recovery"); }
      var ar = d.auto_replay;
      if (ar && ar.armed === false) {
        // "disarmed — replay is switched off" reads as a fault report about a
        // switch the operator chose. It is one clause, in their own terms.
        parts.push(ar.missing_link === "disabled"
          ? "auto-replay off by configuration"
          : "auto-replay disarmed"
            + (isReported(ar.missing_link)
              ? " — " + replayLinkText(ar.missing_link) : ""));
      }
      return parts.join(" · ");
    },
    bulkhead: function (d) {
      var sm = (d && d.summary) || {};
      var parts = [];
      if (isReported(sm.total_bulkheads)) {
        parts.push(sm.total_bulkheads
          + (sm.total_bulkheads === 1 ? " bulkhead" : " bulkheads"));
      }
      if (isReported(sm.total_active)) {
        parts.push(sm.total_active + (sm.total_active === 1 ? " call" : " calls")
          + " in flight");
      }
      if (isReported(sm.high_utilization)) {
        parts.push("above 80% utilisation: " + sm.high_utilization.join(", "));
      }
      if (isReported(sm.total_rejected)) {
        parts.push(sm.total_rejected + " rejected since start");
      }
      return parts.join(" · ");
    },
    emergency: function (d) {
      d = d || {};
      if (d.is_active === false) { return "no emergency declared"; }
      if (d.is_active !== true) { return ""; }
      var s = "emergency active";
      if (isReported(d.level)) { s += " at " + d.level; }
      if (isReported(d.activation_reason)) { s += " — " + d.activation_reason; }
      if (d.is_recovering === true) { s += " · gradual recovery under way"; }
      return s;
    },
    canary: function (d) {
      var rollouts = d && d.rollouts;
      if (!Array.isArray(rollouts)) { return ""; }
      if (!rollouts.length) { return "no rollouts on record"; }
      var n = { active: 0, created: 0, terminal: 0 };
      rollouts.forEach(function (r) { n[canaryBucket(r && r.state)]++; });
      var parts = [];
      if (n.active) {
        parts.push(n.active + " rollout" + (n.active === 1 ? "" : "s") + " in progress");
      }
      if (n.created) { parts.push(n.created + " staged, not started"); }
      if (!n.active && !n.created) { parts.push("no active rollouts"); }
      if (n.terminal) { parts.push(n.terminal + " finished"); }
      return parts.join(" · ");
    },
    throttle: function (d) {
      d = d || {};
      var gov = d.governance || {};
      var emg = d.emergency || {};
      var rec = d.recovery || {};
      if (gov.kill_switch_active === true) {
        return "kill switch engaged — the adaptive limit is not being applied";
      }
      if (emg.full_stop_active === true) {
        return "full stop — every throttled request is being rejected";
      }
      var parts = [];
      if (isReported(d.current_limit)) {
        parts.push("limit " + d.current_limit + " requests per window");
      }
      if (emg.active === true) { parts.push("emergency tier multipliers applied"); }
      if (rec.dampening_active === true) { parts.push("recovery dampening active"); }
      if (isReported(d.rejected_requests)) {
        parts.push(d.rejected_requests + " rejected since start");
      }
      return parts.join(" · ");
    },
    governance: function (d) {
      var requests = d && d.requests;
      if (!Array.isArray(requests)) { return ""; }
      var pending = pendingApprovals(d);
      if (pending.length) {
        return pending.length + (pending.length === 1 ? " request" : " requests")
          + " waiting on a human decision";
      }
      return requests.length
        ? "nothing waiting on a decision · " + requests.length + " on record"
        : "no approval requests on record";
    },
    meta_watchdog: function (d) {
      d = d || {};
      var comps = d.components || {};
      var names = Object.keys(comps);
      var bad = names.filter(function (n) {
        var s = severityOf(comps[n]);
        return s === "danger" || s === "warn";
      });
      var parts = [];
      if (isReported(d.overall_status)) { parts.push("watchdog reports " + d.overall_status); }
      if (names.length) {
        parts.push(bad.length
          ? bad.length + " of " + names.length + " components unhealthy: " + bad.join(", ")
          : names.length + " components healthy");
      }
      if (isReported(d.last_check)) { parts.push("last check " + relAgoIso(d.last_check)); }
      return parts.join(" · ");
    },
    runtime_config: function (d) {
      d = d || {};
      var parts = [];
      if (d.config && typeof d.config === "object") {
        var n = Object.keys(d.config).length;
        parts.push(n + (n === 1 ? " domain" : " domains") + " editable");
      }
      if (Array.isArray(d.pending_changes)) {
        parts.push(d.pending_changes.length
          ? d.pending_changes.length
            + (d.pending_changes.length === 1 ? " change pending" : " changes pending")
          : "no pending changes");
      }
      if (d.audit_enabled === false) {
        parts.push("audit trail OFF — change reasons are not retained");
      }
      return parts.join(" · ");
    },
    // One expanded circuit-breaker row. A forced-CLOSED breaker must never read
    // "operating normally": an operator pinned traffic through DESPITE the
    // failures, which is what the console's own Allow copy says it does.
    service: function (svc) {
      svc = svc || {};
      var state = typeof svc.state === "string" ? svc.state.toLowerCase() : null;
      var forced = svc.manually_controlled === true;
      // controlled_by_id is permanently null on the console's own action path,
      // so the reason is the only "who" there is — and it drops when unreported
      // rather than promising an operator identity the payload never carries.
      var why = isReported(svc.control_reason) ? " — " + svc.control_reason : "";
      if (forced && state === "closed") {
        return "forced closed by an operator — traffic is passing despite failures" + why;
      }
      if (forced && state === "open") {
        return "blocked by an operator — every call is being rejected" + why;
      }
      if (forced) { return "under an operator override" + why; }
      if (state === "open") {
        var open = "circuit open — calls are being parked instead of sent";
        if (isReported(svc.failure_count)) {
          open += ", after " + svc.failure_count + " failures";
        }
        return open;
      }
      if (state === "half_open") {
        return "probing — the next call decides whether the circuit closes";
      }
      if (state === "closed") {
        var closed = "circuit closed";
        if (isReported(svc.failure_count) && svc.failure_count > 0) {
          closed += " · " + svc.failure_count + " failures recorded";
        }
        return closed;
      }
      return "state not reported — this circuit's condition is unknown";
    }
  };

  // Prose labels for the expanded service row's facts. A translation layer,
  // never a whitelist: a field with no entry still renders under its raw name,
  // so a server-side addition is visible-but-unlabelled rather than silently
  // invisible. Ugly is recoverable; missing is not.
  var FACT_LABELS = {
    state: "state",
    failure_count: "failures",
    success_count: "successes",
    last_failure_at: "last failure",
    opened_at: "opened",
    manually_controlled: "operator override",
    control_reason: "forced by",
    controlled_by_id: "controlled by"
  };
  // Excluded by name. `service_name` IS the row's name, already in the head —
  // repeating it is not a fact about the service. `metadata` is caller-supplied
  // context of unbounded shape, and flattening it re-creates the key->value
  // dump this table exists to replace.
  var FACT_EXCLUDED = { service_name: 1, metadata: 1 };

  // The auto-replay arming chain reports which link is missing as a machine
  // token from a closed set (the server's own link order, plus the probe's
  // failure marker). The same translation-layer rule as FACT_LABELS: a token
  // with no entry renders as itself rather than disappearing, so a new link
  // added server-side is visible-but-untranslated instead of silently absent.
  var REPLAY_LINK_LABELS = {
    disabled: "replay is switched off",
    celery_missing: "Celery is not installed",
    worker_missing: "no worker is consuming the replay queue",
    map_unconfigured: "no domain-to-task map is configured",
    handler_missing: "no replay handler is registered",
    probe_failed: "the worker probe failed"
  };
  function replayLinkText(token) {
    return REPLAY_LINK_LABELS[token] || token;
  }

  // --- Action modal (D10) --------------------------------------------------
  var pendingAction = null;
  function openActionModal(action) {
    pendingAction = action;
    var overlay = document.getElementById("overlay");
    var title = document.getElementById("modal-title");
    var content = document.getElementById("modal-content");
    var result = document.getElementById("modal-result");
    var confirmBtn = document.getElementById("modal-confirm");
    var cancelBtn = document.getElementById("modal-cancel");

    title.textContent = action.label;
    content.textContent = "";
    result.textContent = "";
    result.className = "modal-result";
    // Reset the post-success dismiss state a prior run may have left behind.
    confirmBtn.style.display = "";
    confirmBtn.disabled = false;  // D7: clear a leftover in-flight/success guard
    cancelBtn.textContent = "Cancel";

    var isAdmin = action.risk === "admin";
    confirmBtn.className = isAdmin ? "danger" : "primary";

    if (action.warn) {
      // Real-world side-effect caption (e.g. escalation-test actually pages
      // every configured Slack/PagerDuty channel). Orthogonal to the risk tier:
      // risk answers "what does the server require?", warn answers "what real
      // effect does this have?" — so it renders regardless of operator/admin.
      content.appendChild(el("div", "action-warn", action.warn));
    }

    // Per-field [current] -> [proposed] diff preview (662 D6): when the action
    // carries diffRows + a pre-built rawBody (the Runtime Config editor apply),
    // show the exact changes so a fat-finger edit is caught before the PUT.
    // Replaces the generic "Reversible …" copy for this confirm.
    if (action.diffRows && action.diffRows.length) {
      content.appendChild(el("p", "field-label", "Changes"));
      action.diffRows.forEach(function (d) {
        content.appendChild(el("p", "field-label", d.key));
        content.appendChild(el("p", "field-help",
          String(d.from) + "  →  " + String(d.to)));
      });
    }

    if (action.param) {
      content.appendChild(el("p", null, "Target " + action.param + ":"));
      var paramInput = el("input");
      paramInput.id = "modal-param";
      paramInput.setAttribute("autocomplete", "off");
      content.appendChild(paramInput);
    }
    if (action.bodyField) {
      // Single known field (e.g. resolve "notes"): a plain labelled input with
      // an explanatory placeholder, not a raw-JSON textarea. The value is
      // wrapped into { key: value } at submit; empty -> server default.
      content.appendChild(el("p", null, action.bodyField.label || "Note:"));
      var fieldInput = el("textarea");
      fieldInput.id = "modal-bodyfield";
      fieldInput.style.fontFamily = "inherit";  // prose, not code
      if (action.bodyField.placeholder) {
        fieldInput.placeholder = action.bodyField.placeholder;
      }
      content.appendChild(fieldInput);
    } else if (action.body) {
      content.appendChild(el("p", null, "Request body (JSON, optional):"));
      var bodyInput = el("textarea");
      bodyInput.id = "modal-body";
      bodyInput.value = action.bodyDefault || "{}";  // D4: hint expected shape
      content.appendChild(bodyInput);
    } else if (action.bodyFields) {
      // Structured form: one persistent label + help line per field, with enum
      // fields as <select> so a level cannot be mistyped. The help text stays
      // visible while typing (unlike a placeholder) — a first-time operator
      // needs the explanation in front of them during an incident.
      action.bodyFields.forEach(function (f) {
        content.appendChild(el("p", "field-label", f.label));
        if (f.help) { content.appendChild(el("p", "field-help", f.help)); }
        if (f.type === "checkbox") {
          var wrap = el("label", "field-check");
          var cb = el("input");
          cb.type = "checkbox";
          cb.id = "modal-bf-" + f.key;
          if (f.default) { cb.checked = true; }
          wrap.appendChild(cb);
          wrap.appendChild(document.createTextNode(f.caption || f.label));
          content.appendChild(wrap);
          return;
        }
        var input;
        if (f.type === "select") {
          input = el("select");
          f.options.forEach(function (opt) {
            var o = el("option", null, opt.label || opt.value);
            o.value = opt.value;
            if (opt.value === f.default) { o.selected = true; }
            input.appendChild(o);
          });
        } else {
          input = el("input");
          input.type = (f.type === "number") ? "number" : "text";
          if (f.placeholder) { input.placeholder = f.placeholder; }
          if (f.default != null) { input.value = f.default; }
        }
        input.id = "modal-bf-" + f.key;
        input.setAttribute("autocomplete", "off");
        content.appendChild(input);
      });
    }

    if (isAdmin) {
      // Destructive: typed confirmation + UNLOCK awareness. The server already
      // 403s without BALDUR_ADMIN_UNLOCK=1 (auth double-gate) — explain it.
      var hint = el("div", "unlock-hint",
        "Destructive ADMIN action. Type CONFIRM below to send it — a " +
        "client-side check to prevent accidental clicks, NOT the server unlock. " +
        "Separately, the server runs ADMIN operations only when launched with " +
        "BALDUR_ADMIN_UNLOCK=1 (default off); otherwise it returns 403.");
      content.appendChild(hint);
      var typed = el("input");
      typed.id = "modal-typed";
      typed.setAttribute("autocomplete", "off");
      typed.placeholder = "type CONFIRM";
      content.appendChild(typed);
    } else {
      content.appendChild(el("p", null,
        "Reversible OPERATOR action. Proceed?"));
    }
    overlay.style.display = "flex";
  }

  function closeModal() {
    document.getElementById("overlay").style.display = "none";
    pendingAction = null;
  }

  function runPendingAction() {
    var action = pendingAction;
    if (!action) { return; }
    var result = document.getElementById("modal-result");
    var confirmBtn = document.getElementById("modal-confirm");

    if (action.risk === "admin") {
      var typed = document.getElementById("modal-typed");
      if (!typed || typed.value.trim() !== "CONFIRM") {
        result.className = "modal-result notice";
        result.textContent = "Type CONFIRM to run a destructive action.";
        return;
      }
    }

    var path = action.path;
    if (action.param) {
      var pv = (document.getElementById("modal-param") || {}).value;
      if (!pv) {
        result.className = "modal-result notice";
        result.textContent = "Provide a " + action.param + ".";
        return;
      }
      path = path.replace("{" + action.param + "}", encodeURIComponent(pv.trim()));
    }

    var opts = { method: action.method };
    if (action.rawBody != null) {
      // Pre-built JSON payload (Runtime Config editor apply, 662 D6): the form
      // was rendered by the drill-down, the diff preview shown above; send the
      // already-serialized body verbatim (no modal input to read).
      opts.body = action.rawBody;
      opts.headers = { "Content-Type": "application/json" };
    } else if (action.bodyField) {
      var fieldEl = document.getElementById("modal-bodyfield");
      var fieldVal = fieldEl ? fieldEl.value.trim() : "";
      if (action.bodyField.required && !fieldVal) {
        // D8: server 400s on an empty required field — abort inline so the
        // operator learns it is mandatory at the field, not from the HTTP 400.
        result.className = "modal-result notice";
        result.textContent =
          "Provide a " + (action.bodyField.label || action.bodyField.key) + ".";
        return;
      }
      if (fieldVal) {
        var payload = {};
        payload[action.bodyField.key] = fieldVal;
        opts.body = JSON.stringify(payload);
        opts.headers = { "Content-Type": "application/json" };
      }
      // Empty: omit the body so the server applies its default note.
    } else if (action.body) {
      var raw = (document.getElementById("modal-body") || {}).value || "{}";
      try { JSON.parse(raw); } catch (_e) {
        result.className = "modal-result notice";
        result.textContent = "Body is not valid JSON.";
        return;
      }
      opts.body = raw;
      opts.headers = { "Content-Type": "application/json" };
    } else if (action.bodyFields) {
      var payload = {};
      for (var i = 0; i < action.bodyFields.length; i++) {
        var f = action.bodyFields[i];
        var node = document.getElementById("modal-bf-" + f.key);
        if (!node) { continue; }
        if (f.type === "checkbox") { payload[f.key] = node.checked; continue; }
        var fv = (node.value == null ? "" : String(node.value)).trim();
        if (f.required && !fv) {
          // Mirror the server 400 at the field so the operator learns it is
          // mandatory here, not from the HTTP error.
          result.className = "modal-result notice";
          result.textContent = "Provide a " + f.label + ".";
          return;
        }
        if (!fv) { continue; }  // optional + empty -> omit so the server default applies
        if (f.type === "number") {
          var n = parseInt(fv, 10);
          if (isNaN(n)) {
            result.className = "modal-result notice";
            result.textContent = f.label + " must be a number.";
            return;
          }
          payload[f.key] = n;
        } else {
          payload[f.key] = fv;
        }
      }
      opts.body = JSON.stringify(payload);
      opts.headers = { "Content-Type": "application/json" };
    }

    // D7 double-submit guard: all pre-flight validations have passed, so block
    // re-entry while the request is outstanding — escalation-test pages a real
    // channel per click (D2), so a double-fire would page twice. Re-enabled in
    // the failure branches below; the success branch hides the button instead.
    confirmBtn.disabled = true;
    result.className = "modal-result spinner";
    result.textContent = "Running…";
    adminFetch(path, opts)
      .then(function (resp) {
        return resp.text().then(function (txt) {
          if (resp.ok) {
            // Success: switch the modal to a dismiss-only state — the operator
            // reads the result then closes deliberately, and a second Confirm
            // click cannot re-run the action (pendingAction cleared + button
            // hidden).
            pendingAction = null;
            document.getElementById("modal-confirm").style.display = "none";
            document.getElementById("modal-cancel").textContent = "Close";
            result.className = "modal-result";
            result.textContent = "";
            result.appendChild(el("div", null, "✓ Success (HTTP " + resp.status + ")"));
            // Render a JSON response as a severity-colored, bounded kv tree so a
            // health-shaped result (e.g. force-check's overall_status + per-
            // component statuses) reads as a colored verdict, not a raw blob.
            // Non-JSON / empty bodies fall back to plain text.
            var okParsed = null;
            if (txt) { try { okParsed = JSON.parse(txt); } catch (_e) { okParsed = null; } }
            if (okParsed !== null && typeof okParsed === "object") {
              var okBox = el("div", "list-scroll");
              renderStructured(okBox, okParsed, 0);
              result.appendChild(okBox);
            } else if (txt) {
              result.appendChild(el("div", "kv-val", txt));
            }
            // Refresh the owning surface (panel stats / drill-down / row context)
            // so the new numbers show behind the modal without a manual reload.
            if (typeof action.onDone === "function") {
              try { action.onDone(); } catch (_e) { /* must not break modal */ }
            }
            return;
          }
          result.className = "modal-result notice";
          if (resp.status === 403) {
            result.textContent =
              "403 Forbidden — ADMIN operations need BALDUR_ADMIN_UNLOCK=1 " +
              "and a valid admin key.";
          } else if (resp.status === 401) {
            result.textContent = "401 — set the admin key in the header bar.";
          } else if (resp.status === 409) {
            // 685 D6 stale-page convergence: a lock acquired after page load
            // leaves a stale-enabled Apply; the PUT 409s with ROLLOUT_CONFLICT.
            // Render the lock banner (naming the owning rollout from the message)
            // instead of a generic error, matching the pre-load affordance.
            var lockMsg = null;
            var busyState = null;
            try {
              var pj = JSON.parse(txt);
              if (pj && pj.error_code === "ROLLOUT_CONFLICT") { lockMsg = pj.error; }
              // Meta-Watchdog force-check: a check already running is the
              // endpoint's designed answer, not a failure. Render the returned
              // snapshot the same way the 200 branch does instead of dropping
              // it into the raw-blob fallthrough below.
              if (pj && pj.error_code === "check_in_progress") { busyState = pj; }
            } catch (_e) { lockMsg = null; busyState = null; }
            if (busyState !== null) {
              result.textContent = "";
              result.appendChild(el("div", null,
                "Watchdog is mid-diagnosis — a health check is already running. "
                + "The last completed snapshot is below; retry once it finishes."));
              var busyBox = el("div", "list-scroll");
              renderStructured(busyBox, busyState, 0);
              result.appendChild(busyBox);
            } else {
              result.textContent = lockMsg
                ? ("Blocked by an active canary rollout.\n" + lockMsg + "\n"
                   + "Roll back or cancel the rollout from the Canary Rollouts "
                   + "panel, or wait.")
                : ("HTTP 409\n" + txt);
            }
          } else {
            result.textContent = "HTTP " + resp.status + "\n" + txt;
          }
          confirmBtn.disabled = false;  // D7: re-arm for a corrected retry
        });
      })
      .catch(function (err) {
        result.className = "modal-result notice";
        result.textContent = (err && err.name === "AbortError")
          ? "server slow/unresponsive — verify via curl"
          : "request failed: " + ((err && err.message) || err);
        confirmBtn.disabled = false;  // D7: re-arm after a network failure
      });
  }

  // --- Build the page ------------------------------------------------------
  // Body-only refreshers (one per built panel row) for the header auto-refresh
  // toggle; reset on every refreshAll() rebuild.
  var panelRefreshers = [];
  var autoRefreshTimer = null;

  // Row skeleton shared by both kinds. The head is the compact line the System
  // tier shows; the body is hidden until the operator expands the row.
  function buildRowShell(key, kind, name, isPro) {
    var row = { key: key, kind: kind, sev: "none", answered: false, dataAt: null };
    var node = el("div", "row");
    node.dataset.sev = "none";
    var head = el("div", "row-head");
    head.setAttribute("aria-expanded", "false");
    head.appendChild(el("span", "st"));
    head.appendChild(el("span", "name", name));
    if (isPro) { head.appendChild(el("span", "tag pro", "PRO")); }
    row.descEl = el("span", "desc", "");
    head.appendChild(row.descEl);
    // The trailing token rides the always-on freshness ticker: a panel row
    // shows its own fetch age, a service row its opened_at event time.
    row.whenEl = el("span", "when updated", "");
    head.appendChild(row.whenEl);
    var refresh = el("button", "row-refresh", "↻");
    refresh.title = "Refresh";
    refresh.setAttribute("type", "button");
    refresh.addEventListener("click", function (e) {
      e.stopPropagation();          // the head itself toggles the accordion
      refreshRow(row);
    });
    head.appendChild(refresh);
    row.chevEl = el("span", "chev", "▸");
    head.appendChild(row.chevEl);
    head.addEventListener("click", function () { toggleRow(row); });
    node.appendChild(head);

    row.bodyWrap = el("div", "row-body");
    row.bodyWrap.style.display = "none";
    node.appendChild(row.bodyWrap);
    row.node = node;
    row.headEl = head;
    return row;
  }

  // A mounted drill-down is deliberately NOT rebuilt by the 15 s body refresher
  // (a refresh must never yank content out from under an operator mid-triage),
  // so the row's own "updated Xs ago" token describes the STATUS fetch only. It
  // can read "just now" over drill-down content from twenty minutes ago. The
  // drill-down therefore states its own age, on the same always-on ticker.
  function drillAgeText(t) { return "drill-down loaded " + relAgo(t); }
  function stampDrilldown(row) {
    if (!row.drillAgeEl) { return; }
    row.drillAgeEl._t = Date.now();
    row.drillAgeEl._fmt = drillAgeText;
    row.drillAgeEl.textContent = drillAgeText(row.drillAgeEl._t);
  }

  function toggleRow(row) {
    row.open = !row.open;
    row.bodyWrap.style.display = row.open ? "" : "none";
    row.chevEl.textContent = row.open ? "▾" : "▸";
    row.node.classList.toggle("open", row.open);
    row.headEl.setAttribute("aria-expanded", row.open ? "true" : "false");
    // Drill-downs mount on FIRST expansion, not at boot: severity needs only
    // the status fetch, so a page load costs one request per row instead of two.
    if (row.open && row.drillFn && !row.drillMounted) {
      row.drillMounted = true;
      row.drillFn(row.drillEl);
      stampDrilldown(row);
    }
  }

  // Refresh the whole row surface: status body + (if mounted) the drill-down.
  // Wired to ↻ and to each action's post-success onDone. A service row has no
  // fetch of its own — the breaker panel's list call is its only source.
  function refreshRow(row) {
    if (row.kind === "service") {
      var cb = ROW_BY_KEY["p:circuit_breaker"];
      if (cb) { refreshRow(cb); }
      return;
    }
    loadPanel(row.panel, row);
    if (row.drillMounted && row.drillFn) {
      row.drillEl.textContent = "";
      row.drillFn(row.drillEl);
      stampDrilldown(row);
    }
  }

  // The action loop, shared by panel rows and expanded service rows. On a
  // service row the target is pre-bound, so "Reset breaker" on the payments row
  // targets payments instead of asking the operator to retype a name the row
  // already states.
  function buildActions(p, row, boundParam) {
    if (!p.actions || !p.actions.length) { return; }
    var actions = el("div", "panel-actions");
    var rendered = 0;
    p.actions.forEach(function (a) {
      // Per-action PRO gate (D5): a `pro: true` action is hidden unless the
      // panel's backing slot reports PRO present. Reuses the same
      // __BALDUR_PANELS__ map that panelVisible consults for whole-panel
      // gating, so a partly-OSS panel (dlq) shows its OSS actions and hides
      // its PRO-only ones (Replay/Archive/Purge).
      if (a.pro && (window.__BALDUR_PANELS__ || {})[p.id] !== true) { return; }
      var btn = el("button", btnClass(a), a.label);
      // Copy the action so the post-success refresh (and any pre-bound target)
      // is attached without mutating the shared PANELS config.
      btn.addEventListener("click", function () {
        openActionModal(bindAction(a, boundParam, function () { refreshRow(row); }));
      });
      actions.appendChild(btn);
      rendered++;
    });
    if (rendered) { row.bodyWrap.appendChild(actions); }
  }
  function bindAction(a, boundParam, onDone) {
    var bound = Object.assign({}, a, { onDone: onDone });
    if (boundParam && a.param) {
      bound.path = a.path.replace("{" + a.param + "}",
        encodeURIComponent(boundParam));
      bound.param = null;   // the modal no longer asks for a target
    }
    return bound;
  }

  function buildPanelRow(p) {
    var row = buildRowShell("p:" + p.id, "panel", p.title, p.pro);
    row.panel = p;
    row.bodyEl = el("div", "panel-body");
    row.bodyWrap.appendChild(row.bodyEl);
    // Bespoke drill-down hook (550 D3): the generic shape stays the single
    // source of truth (PANELS); a panel's `drilldown: "<key>"` selects its
    // one-off table/detail renderer from the DRILLDOWNS dispatch table.
    row.drillFn = p.drilldown ? DRILLDOWNS[p.drilldown] : null;
    if (row.drillFn) {
      row.drillEl = el("div", "panel-drilldown");
      row.bodyWrap.appendChild(row.drillEl);
      // Sibling, not a child: refreshRow clears drillEl's children on rebuild.
      row.drillAgeEl = el("div", "drill-age updated");
      row.bodyWrap.appendChild(row.drillAgeEl);
    }
    buildActions(p, row, null);
    return row;
  }

  // An expanded circuit-breaker row: one per application service the LIST call
  // returned. GET /control/status/{name} is deliberately NOT used — it calls
  // get_or_create_state, so expanding a row for a name the server has never
  // observed would CREATE the breaker record and then describe the record it
  // just made. A read must not manufacture its own answer.
  function buildServiceRow(cbPanel, serviceName) {
    var row = buildRowShell("cb:" + serviceName, "service", serviceName, false);
    row.service = serviceName;
    row.panel = cbPanel;
    row.factsEl = el("div", "facts");
    row.bodyWrap.appendChild(row.factsEl);
    buildActions(cbPanel, row, serviceName);
    return row;
  }

  function renderServiceRow(row) {
    var svc = row.status || {};
    describeRow(row);
    // Facts: value-based, never key-based. /control/status emits a fixed 10-key
    // dict with null in the empty slots, so "one row per key present" would
    // print `opened_at: null` on every healthy service — the key->value dump
    // this table exists to replace, with null shown to the operator.
    row.factsEl.textContent = "";
    Object.keys(svc).forEach(function (k) {
      if (FACT_EXCLUDED[k]) { return; }
      if (!isReported(svc[k])) { return; }
      // `controlled_by_id` is an identity slot, and 0 is its no-identity value:
      // the control path passes None on every non-Django boot ("the audit trail
      // is the single source of truth for who"), which serialises to 0 here.
      // A fact reading `controlled by 0` names nobody — the same absence
      // isReported drops for null, wearing a different placeholder.
      if (k === "controlled_by_id" && !svc[k]) { return; }
      var fact = el("div", "fact");
      fact.appendChild(el("span", "k", FACT_LABELS[k] || k));
      fact.appendChild(el("span", "v", factValue(k, svc[k])));
      row.factsEl.appendChild(fact);
    });
    // Trailing token: a real event time when the payload reports one, else the
    // panel's fetch age. opened_at is an ISO string, so it needs relAgoIso —
    // relAgo takes epoch ms and would render nonsense from a string.
    if (isReported(svc.opened_at)) {
      var opened = Date.parse(svc.opened_at);
      if (!isNaN(opened)) {
        row.whenEl._t = opened;
        row.whenEl._fmt = openedAtText;
        row.whenEl.textContent = openedAtText(opened);
        return;
      }
    }
    var cb = ROW_BY_KEY["p:circuit_breaker"];
    row.whenEl._fmt = null;
    row.whenEl._t = (cb && cb.whenEl._t) || null;
    row.whenEl.textContent = row.whenEl._t ? "updated " + relAgo(row.whenEl._t) : "";
  }
  function openedAtText(t) { return "opened " + clockOf(t) + " · " + relAgo(t); }
  function factValue(key, value) {
    if (typeof value === "boolean") { return value ? "yes" : "no"; }
    if (key === "opened_at" || key === "last_failure_at") {
      return clockOfIso(value) + " · " + relAgoIso(value);
    }
    return String(value);
  }

  function describeRow(row) {
    var text = "";
    if (row.kind === "service") {
      text = DESCRIBERS.service(row.status);
    } else if (row.answered) {
      var describe = DESCRIBERS[row.panel.id];
      text = describe ? describe(row.status) : "";
      // The per-row datum comes from a second payload, so it is joined here
      // rather than inside the describer, which may only read its own status.
      var token = healingRowToken(row.panel.id);
      if (token) { text = text ? text + " · " + token : token; }
    } else if (row.notice) {
      text = "status not obtained — " + row.notice;
    }
    row.descEl.textContent = text;
  }

  // The breaker panel's services[] is the sole author of which service rows
  // exist. Keyed on the name, never on position: a reordered list must not
  // rename one service's contents onto another.
  function syncServiceRows(data) {
    var cbRow = ROW_BY_KEY["p:circuit_breaker"];
    if (!cbRow) { return; }
    var services = (data && data.services) || [];
    if (!Array.isArray(services)) { services = []; }
    var live = {};
    var ordered = [];
    services.forEach(function (svc) {
      svc = svc || {};
      var name = svc.service_name == null ? "" : String(svc.service_name);
      if (!name || live["cb:" + name]) { return; }
      var key = "cb:" + name;
      live[key] = true;
      var row = ROW_BY_KEY[key];
      if (!row) {
        row = buildServiceRow(cbRow.panel, name);
        ROW_BY_KEY[key] = row;
      }
      row.status = svc;
      row.answered = true;
      row.dataAt = cbRow.dataAt;
      ordered.push(row);
    });
    // A service that disappeared loses its row AND its HEALTH key in the same
    // step. The map is otherwise write-only until a full rebuild, so a stale
    // key would inflate every count derived from it.
    Object.keys(ROW_BY_KEY).forEach(function (key) {
      if (key.indexOf("cb:") !== 0 || live[key]) { return; }
      var gone = ROW_BY_KEY[key];
      if (gone.node.parentNode) { gone.node.parentNode.removeChild(gone.node); }
      delete ROW_BY_KEY[key];
      delete HEALTH[key];
    });
    // Service rows sit as a contiguous block immediately above their panel row,
    // in services[] order. The panel row itself is ALWAYS kept: its three
    // actions take a free-typed service name, so on a fresh install (or a
    // degraded backend serving an empty memory view) it is the only /control
    // surface the console has left.
    var others = ROWS.filter(function (r) { return r.kind !== "service"; });
    var at = others.indexOf(cbRow);
    if (at < 0) { at = others.length; }
    ROWS = others.slice(0, at).concat(ordered, others.slice(at));
    ordered.forEach(function (row) {
      HEALTH[row.key] = serviceSeverity(row.status);
      row.sev = HEALTH[row.key];
      row.node.dataset.sev = row.sev;
      renderServiceRow(row);
    });
    LAST_PLACEMENT = "";   // the row SET changed, not just a severity
    placeRows();
    renderTriage();
  }

  // --- Healing ledger ------------------------------------------------------
  // There is no history API: /dashboard/summary is snapshot aggregates and
  // /dlq/list is a page of entries. The series is therefore DERIVED from a
  // bounded page walk — fails by created_at, heals by resolved_at — and the
  // caption states that bound rather than implying the chart is a record.
  var LEDGER_PAGE_SIZE = 100;
  var LEDGER_MAX_PAGES = 3;
  // How far back the page walk is allowed to reach. NOT the rendered span:
  // the axis covers what the walk actually fetched.
  var LEDGER_SPAN_MS = 6 * 60 * 60 * 1000;
  var LEDGER_BUCKET_COUNT = 24;
  var LEDGER_BUCKET_MIN = 6;
  // Snapping UP to a ladder value keeps axis labels on round times and caps
  // the bucket count at LEDGER_BUCKET_COUNT by construction. A live incident
  // renders at 30-second granularity; a quiet system whose entries span hours
  // renders at hour granularity. One behaviour, no mode switch, no setting.
  var LEDGER_BUCKET_LADDER = [
    10 * 1000, 30 * 1000, 60 * 1000,
    5 * 60 * 1000, 15 * 60 * 1000, 30 * 60 * 1000, 60 * 60 * 1000
  ];

  // Plot geometry — layout-fixed literals, not operational values.
  var LG = {
    w: 1180, h: 250, left: 36, right: 1160,
    openTop: 26, openBottom: 118,
    barBottom: 216, barHeight: 70,
    axisY: 216, labelY: 236
  };

  var ledgerGeneration = 0;
  var ledgerInFlight = false;
  var ledgerRerun = false;
  var ledgerState = null;
  var ledgerRect = null;   // cached; a rect read per mousemove forces a layout

  // /healing/summary and the ledger walk are two independent fetches with no
  // shared completion signal, so neither may assume it painted last. The
  // healing payload is kept here, and the last series the ledger computed is
  // kept alongside it, so whichever answers second can re-render the other's
  // work instead of silently dropping its own.
  var healingSummary = null;
  var lastLedgerSeries = null;

  function svgEl(tag, attrs) {
    var node = document.createElementNS("http://www.w3.org/2000/svg", tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) { node.setAttribute(k, attrs[k]); });
    }
    return node;
  }
  function svgText(x, y, text, cls) {
    var node = svgEl("text", { x: x, y: y, class: cls || "" });
    node.textContent = text;        // safe-DOM holds for SVG text too
    return node;
  }

  // The dashboard row already fetched /dashboard/summary. Reuse it — a second
  // request for the same payload would be the only new server traffic here.
  function summaryPayload() {
    var row = ROW_BY_KEY["p:dashboard"];
    return (row && row.answered) ? row.status : null;
  }

  function refreshLedger(force) {
    if (ledgerInFlight) {
      // One chain at a time. A chain is up to 3 sequential pages at the fetch
      // timeout, i.e. the refresh period itself, so overlap is reachable — not
      // theoretical — on a slow DLQ backend.
      //
      // A FORCED refresh supersedes the live chain, so the generation is bumped
      // HERE. Bumping only where a chain starts would advance the counter solely
      // while none is running, which makes the guards below unreachable and lets
      // a superseded chain paint its own result first: paste an admin key into a
      // console whose boot fetch is still 401ing and the stale chain writes
      // "series unavailable" over the ledger before the rerun replaces it. A
      // plain 15 s tick is dropped instead of superseding, so it must NOT bump.
      if (force) { ledgerRerun = true; ledgerGeneration++; }
      return;
    }
    ledgerInFlight = true;
    var generation = ++ledgerGeneration;
    var entries = [];
    var totalCount = null;
    var truncated = false;
    var partial = false;
    var cutoff = Date.now() - LEDGER_SPAN_MS;

    function fetchPage(n) {
      // The page-size literal is a banned anchor (a retired domain-sample
      // fetch used it), so the query is composed from the constant.
      return adminFetch("/dlq/list?page=" + n + "&page_size=" + LEDGER_PAGE_SIZE)
        .then(function (resp) {
          if (!resp.ok) { throw new Error("HTTP " + resp.status); }
          return resp.json();
        });
    }

    function walk(n) {
      return fetchPage(n).then(function (body) {
        var pagination = (body && body.pagination) || {};
        var results = (body && body.results) || [];
        if (n === 1) {
          // total_pages is max(1, …) on success and 0 on the repository
          // fail-open path, so 0 is a raising backend, not an empty queue.
          if (pagination.total_pages === 0) {
            throw new Error("the DLQ store did not answer");
          }
          if (typeof pagination.total_count === "number") {
            totalCount = pagination.total_count;
          }
        }
        entries = entries.concat(results);
        if (!pagination.has_next) { return null; }
        var oldest = oldestCreatedAt(entries);
        if (n >= LEDGER_MAX_PAGES || (oldest !== null && oldest < cutoff)) {
          truncated = true;
          return null;
        }
        return walk(n + 1);
      }, function (err) {
        // A page after the first failing leaves a real, shorter window.
        if (n > 1) { partial = true; return null; }
        throw err;
      });
    }

    walk(1).then(function () {
      if (generation !== ledgerGeneration) { return; }
      if (totalCount !== null && totalCount > entries.length) { truncated = true; }
      ledgerState = {
        entries: entries, totalCount: totalCount, truncated: truncated,
        partial: partial, fetchedAt: Date.now()
      };
      renderLedger();
    }).catch(function (err) {
      if (generation !== ledgerGeneration) { return; }
      ledgerState = null;
      lastLedgerSeries = null;
      renderLedgerState("series unavailable — " + ((err && err.message) || err));
    }).then(function () {
      ledgerInFlight = false;
      if (ledgerRerun) { ledgerRerun = false; refreshLedger(true); }
    });
  }

  // Its OWN chain, terminating in its own .catch. Joined into the ledger's, a
  // rejection here would reach that chain's handler and paint "series
  // unavailable" over a plot whose own fetch succeeded — a secondary payload
  // must not be able to blank a primary one.
  function refreshHealing() {
    adminFetch("/healing/summary").then(function (resp) {
      if (!resp.ok) { throw new Error("HTTP " + resp.status); }
      return resp.json();
    }).then(function (body) {
      healingSummary = body || null;
      renderHealingArrival();
    }).catch(function () {
      // No source: no counters, no scope caption, no row tokens. The ledger
      // keeps everything it rendered.
      healingSummary = null;
      renderHealingArrival();
    });
  }

  // The arrival re-render. Auto-refresh ships off, so a healing payload landing
  // after the ledger chain has finished would otherwise paint nothing at all
  // until the operator reloaded the page by hand — and land before it roughly
  // half the time, which is how the failure stays invisible.
  function renderHealingArrival() {
    renderLedgerCaption(lastLedgerSeries);
    renderLedgerFooter(lastLedgerSeries);
    ["p:dashboard", "p:dlq"].forEach(function (key) {
      var row = ROW_BY_KEY[key];
      if (row && row.answered) { describeRow(row); }
    });
  }

  function oldestCreatedAt(entries) {
    var oldest = null;
    entries.forEach(function (e) {
      var t = Date.parse(e && e.created_at);
      if (!isNaN(t) && (oldest === null || t < oldest)) { oldest = t; }
    });
    return oldest;
  }

  function renderLedgerState(message) {
    var plot = document.getElementById("ledger-plot");
    if (!plot) { return; }
    plot.textContent = "";
    plot.appendChild(el("div", "ledger-state", message));
    setText("ledger-window", "");
    setText("ledger-age", "");
    var ageEl = document.getElementById("ledger-age");
    if (ageEl) { ageEl._t = null; }
    // No operands means no window counters — max() of nothing is not zero. But
    // clearing the elements outright here would also erase what /healing/summary
    // reported, which this fetch says nothing about, so both renderers are asked
    // to redraw with no series instead of being bypassed.
    renderLedgerCaption(null);
    renderLedgerFooter(null);
  }
  function setText(id, text) {
    var node = document.getElementById(id);
    if (node) { node.textContent = text; }
  }

  // Bucket the fetched window. The width is derived from what was actually
  // fetched, not fixed: a 7-minute incident and a 6-hour quiet stretch both
  // have to read as a time axis.
  function ledgerSeries(state) {
    var now = state.fetchedAt;
    var creates = [];
    var heals = [];
    var stillOpen = 0;
    state.entries.forEach(function (e) {
      var c = Date.parse(e && e.created_at);
      if (!isNaN(c)) { creates.push(c); }
      var r = Date.parse(e && e.resolved_at);
      if (!isNaN(r)) { heals.push(r); }
      if (!isReported(e && e.resolved_at)) { stillOpen++; }
    });
    var oldest = creates.length ? Math.min.apply(null, creates) : null;
    var span = 0;
    if (oldest !== null) { span = Math.max(1, now - oldest); }
    var width = LEDGER_BUCKET_LADDER[LEDGER_BUCKET_LADDER.length - 1];
    for (var i = 0; i < LEDGER_BUCKET_LADDER.length; i++) {
      if (LEDGER_BUCKET_LADDER[i] >= span / LEDGER_BUCKET_COUNT) {
        width = LEDGER_BUCKET_LADDER[i];
        break;
      }
    }
    // The floor left-pads with empty buckets so a 20-second-old incident reads
    // as a time axis rather than one lone block.
    var count = Math.min(LEDGER_BUCKET_COUNT,
      Math.max(LEDGER_BUCKET_MIN, Math.ceil(span / width)));
    var end = now;
    var start = end - count * width;
    var fails = [];
    var healed = [];
    for (var b = 0; b < count; b++) { fails.push(0); healed.push(0); }
    function drop(times, into) {
      times.forEach(function (t) {
        var idx = Math.floor((t - start) / width);
        if (idx < 0 || idx >= count) { return; }
        into[idx]++;
      });
    }
    drop(creates, fails);
    drop(heals, healed);

    // Right-edge anchor for the open series. The summary half silently zeroes
    // with no statistics adapter registered — the shipped memory/Redis OSS
    // configuration — and a TRUNCATED window is a lower bound of true open, so
    // max() is the honest floor across those two.
    //
    // Not, however, when the window is WHOLE. Then `entries` is every entry the
    // store holds, `stillOpen` is the count rather than a floor, and it is read
    // fresh while /dashboard/summary is cache-served for its TTL. Taking the max
    // there is how a completed recovery keeps reading as a live incident: drain
    // the queue and for one TTL the strip and the right edge stay pinned to the
    // pre-drain number, directly above the heal bars that emptied it.
    var summary = summaryPayload();
    var overview = (summary && summary.overview) || {};
    var summaryOpen = null;
    if (isReported(overview.pending) || isReported(overview.failed)) {
      summaryOpen = (overview.pending || 0) + (overview.failed || 0);
    }
    var whole = windowIsWhole(state);
    var anchor = (summaryOpen === null || whole)
      ? stillOpen
      : Math.max(stillOpen, summaryOpen);
    var open = [];
    var running = anchor;
    for (var k = count - 1; k >= 0; k--) {
      open[k] = running;
      // open(t-1) = open(t) - creates(t) + heals(t)
      running = Math.max(0, running - fails[k] + healed[k]);
    }
    return {
      start: start, end: end, width: width, count: count,
      fails: fails, heals: healed, open: open,
      stillOpen: stillOpen, summaryOpen: summaryOpen, anchor: anchor,
      healedInWindow: heals.length, summary: summary, whole: whole
    };
  }

  // The window is WHOLE when nothing was left out of it: no page cap, no
  // 6-hour cutoff, and a server-reported total that matches what was fetched.
  // Everywhere else the window is a sample and its counts are lower bounds.
  function windowIsWhole(state) {
    return !!state && !state.truncated && !state.partial
      && state.totalCount !== null && state.totalCount === state.entries.length;
  }

  function renderLedger() {
    var state = ledgerState;
    var plot = document.getElementById("ledger-plot");
    if (!state || !plot) { return; }
    if (!state.entries.length) {
      // Distinct from "unavailable": the query succeeded and the window is
      // genuinely empty. It says nothing about history outside the window.
      lastLedgerSeries = null;
      renderLedgerState("no failures in the fetched window");
      renderLedgerCaption(null);
      renderLedgerFooter(null);
      return;
    }
    var series = ledgerSeries(state);
    lastLedgerSeries = series;
    plot.textContent = "";

    var svg = svgEl("svg", {
      viewBox: "0 0 " + LG.w + " " + LG.h,
      width: "100%", height: LG.h, "font-family": "IBM Plex Mono, monospace"
    });
    var plotWidth = LG.right - LG.left;
    var step = plotWidth / series.count;
    var maxOpen = Math.max(1, Math.max.apply(null, series.open));
    var maxBar = Math.max(1, Math.max.apply(null, series.fails.concat(series.heals)));
    function xAt(i) { return LG.left + i * step; }
    function yOpen(v) {
      return LG.openBottom - (v / maxOpen) * (LG.openBottom - LG.openTop);
    }

    // Open-count band: gridlines + the step line with a wash beneath it.
    [maxOpen, Math.round(maxOpen / 2), 0].forEach(function (v) {
      svg.appendChild(svgEl("line", {
        x1: LG.left, y1: yOpen(v), x2: LG.right, y2: yOpen(v),
        stroke: "var(--ink3)", "stroke-width": 1
      }));
      svg.appendChild(svgText(6, yOpen(v) + 4, String(v), "lg-axis"));
    });
    var points = [];
    for (var i = 0; i < series.count; i++) {
      points.push(xAt(i) + "," + yOpen(series.open[i]));
      points.push(xAt(i + 1) + "," + yOpen(series.open[i]));
    }
    svg.appendChild(svgEl("path", {
      d: "M" + points.join(" L"), fill: "none",
      stroke: "var(--open)", "stroke-width": 2
    }));
    svg.appendChild(svgEl("path", {
      d: "M" + points.join(" L") + " L" + LG.right + "," + yOpen(0)
        + " L" + LG.left + "," + yOpen(0) + " Z",
      fill: "var(--open)", "fill-opacity": 0.07, stroke: "none"
    }));

    // Fail / heal bars, paired inside each bucket.
    var barW = Math.max(3, Math.min(9, step * 0.34));
    for (var b = 0; b < series.count; b++) {
      var base = xAt(b) + step / 2 - barW - 1;
      if (series.fails[b]) {
        var fh = (series.fails[b] / maxBar) * LG.barHeight;
        svg.appendChild(svgEl("rect", {
          x: base, y: LG.barBottom - fh, width: barW, height: fh,
          fill: "var(--ember)", opacity: 0.85
        }));
      }
      if (series.heals[b]) {
        var hh = (series.heals[b] / maxBar) * LG.barHeight;
        svg.appendChild(svgEl("rect", {
          x: base + barW + 2, y: LG.barBottom - hh, width: barW, height: hh,
          fill: "var(--moss)", opacity: 0.85
        }));
      }
    }
    svg.appendChild(svgEl("line", {
      x1: LG.left, y1: LG.axisY, x2: LG.right, y2: LG.axisY,
      stroke: "var(--line)", "stroke-width": 1
    }));

    // Truncation is DRAWN, not footnoted: over a truncated window the oldest
    // bucket shows what fraction of the newest N fell there, never what
    // actually happened then.
    if (state.truncated) {
      svg.appendChild(svgEl("line", {
        x1: LG.left, y1: LG.openTop - 6, x2: LG.left, y2: LG.axisY,
        stroke: "var(--ash2)", "stroke-width": 2, "stroke-dasharray": "2 4"
      }));
      svg.appendChild(svgText(LG.left + 5, LG.openTop - 10, "sample", "lg-axis"));
    }

    // Time labels: every other bucket edge, then the right edge.
    for (var t = 0; t < series.count; t += 2) {
      svg.appendChild(svgText(xAt(t), LG.labelY,
        clockOf(series.start + t * series.width), "lg-axis"));
    }
    // "now" only while the data is younger than one bucket; past that the
    // right edge shows the fetch clock time, so the axis never labels stale
    // data as the present moment.
    var age = Date.now() - state.fetchedAt;
    svg.appendChild(svgText(LG.right - 30, LG.labelY,
      age < series.width ? "now" : clockOf(state.fetchedAt), "lg-axis"));

    // Crosshair: ONE handler over both bands, so cursor sync is by
    // construction rather than a synchronization protocol.
    var cross = svgEl("line", {
      x1: 0, y1: LG.openTop - 6, x2: 0, y2: LG.axisY,
      stroke: "var(--ash2)", "stroke-width": 1, "stroke-dasharray": "3 3",
      opacity: 0
    });
    svg.appendChild(cross);
    plot.appendChild(svg);
    var tip = el("div", "ledger-tip");
    plot.appendChild(tip);
    wireCrosshair(plot, svg, cross, tip, series, step);

    setText("ledger-window", " — all domains · " + describeSpan(series));
    renderLedgerCaption(series);
    renderLedgerFooter(series);
    reresolveDashboardRow();
  }

  // The mirror of the dashboard->ledger hook in loadPanel. The window is what
  // makes a structurally-zero summary detectable at all, and the two fetches
  // race: on a cold load the Dashboard row usually answers first, resolves
  // against a summary it cannot yet contradict, and would keep that verdict —
  // the zeros — until the operator refreshed the row by hand.
  function reresolveDashboardRow() {
    var row = ROW_BY_KEY["p:dashboard"];
    if (!row || !row.answered) { return; }
    // setRowHealth re-describes, re-places and re-renders the verdict, so the
    // sentence and the tier move together — the row cannot end up green with
    // the disagreement sentence, or vice versa.
    setRowHealth(row, panelSeverity(row.panel, row.status));
  }

  function describeSpan(series) {
    var minutes = Math.round((series.end - series.start) / 60000);
    if (minutes < 90) { return "last " + Math.max(1, minutes) + " min"; }
    return "last " + Math.round(minutes / 60) + " h";
  }

  function wireCrosshair(plot, svg, cross, tip, series, step) {
    ledgerRect = null;
    function bucketAt(clientX) {
      if (!ledgerRect) { ledgerRect = svg.getBoundingClientRect(); }
      if (!ledgerRect.width) { return -1; }
      var vx = ((clientX - ledgerRect.left) / ledgerRect.width) * LG.w;
      var idx = Math.floor((vx - LG.left) / step);
      return (idx < 0 || idx >= series.count) ? -1 : idx;
    }
    plot.addEventListener("mousemove", function (e) {
      var idx = bucketAt(e.clientX);
      if (idx < 0) { cross.setAttribute("opacity", 0); tip.style.display = "none"; return; }
      var cx = LG.left + (idx + 0.5) * step;
      cross.setAttribute("x1", cx);
      cross.setAttribute("x2", cx);
      cross.setAttribute("opacity", 1);
      var from = series.start + idx * series.width;
      tip.textContent = clockOf(from) + "–" + clockOf(from + series.width) + "\n"
        + series.fails[idx] + " failed · " + series.heals[idx] + " healed\n"
        + series.open[idx] + " still unhealed";
      tip.style.display = "block";
      var box = plot.getBoundingClientRect();
      tip.style.left = Math.min(box.width - 170, Math.max(0, e.clientX - box.left + 12)) + "px";
      tip.style.top = "8px";
    });
    plot.addEventListener("mouseleave", function () {
      cross.setAttribute("opacity", 0);
      tip.style.display = "none";
    });
    window.addEventListener("resize", function () { ledgerRect = null; });
  }

  // Always rendered: the reader has to know what the axis is a picture OF.
  function renderLedgerCaption(series) {
    var state = ledgerState;
    var healing = healingCaptionPart();
    if (!state) {
      // The window is gone but the healing counters may still be on the strip,
      // and this sentence is the only thing that says whose numbers they are.
      // The window-derived clauses stay behind the guard: a failed window must
      // keep saying nothing about the axis it no longer has.
      setText("ledger-caption", healing);
      return;
    }
    var parts = ["derived from the newest " + state.entries.length
      + (state.totalCount === null ? "" : " of " + state.totalCount)
      + " DLQ entries by creation time"];
    if (state.truncated) {
      parts.push("truncated — the left edge is a sample of the newest entries, "
        + "not a count of what happened then");
    }
    if (state.partial) { parts.push("partial window — a page failed to load"); }
    parts.push("a failure created before this window is off-axis, and heals of "
      + "those entries are not counted; archived-then-purged and evicted "
      + "entries drop out entirely");
    if (series && series.summaryOpen === null) {
      parts.push("no statistics adapter is reporting, so the unhealed count is "
        + "window-derived only");
    } else if (series && summaryDisagreesWithWindow(series.summary)) {
      // Reported, and reported wrong: a summary claiming an empty store while
      // this window holds entries contributes nothing to the counters above,
      // which the max() already handles silently. Saying so is the difference
      // between a number that is quietly window-only and one the reader can
      // trust for the reason stated.
      parts.push("the summary reports an empty store, so the counts are "
        + "window-derived only");
    }
    if (healing) { parts.push(healing); }
    setText("ledger-caption", parts.join(" · "));
    var ageEl = document.getElementById("ledger-age");
    if (!ageEl) { return; }
    // The oldest contributing clock: /dlq/list stamps no timestamp so it is
    // the fetch instant, /dashboard/summary carries the moment its numbers
    // were computed and is cache-served for up to its TTL.
    var oldest = state.fetchedAt;
    var summary = series && series.summary;
    if (summary) {
      var stamped = payloadInstant(summary);
      if (stamped < oldest) { oldest = stamped; }
    }
    ageEl._t = oldest;
    ageEl._fmt = ledgerAgeText;
    ageEl.textContent = ledgerAgeText(oldest);
  }
  function ledgerAgeText(t) { return "as of " + clockOf(t) + " · " + relAgo(t); }

  // The three window counters each take the same shape as the chart's anchor —
  // max(server-reported, window-derived) — so the strip and the chart above it
  // cannot disagree by construction, and a permanently-zero statistics
  // repository (the shipped memory/Redis OSS configuration) cannot print
  // `open 0` over drawn bars.
  //
  // The healing counters follow them and obey a different rule, because they
  // come from a different kind of source — see addHealingCounters.
  function renderLedgerFooter(series) {
    var foot = document.getElementById("ledger-foot");
    if (!foot) { return; }
    foot.textContent = "";
    if (series) {
      var overview = (series.summary && series.summary.overview) || {};
      var activity = (series.summary && series.summary.recent_activity) || {};
      // Two counters one word apart until they were named: the first is every
      // entry not resolved (the line's right-edge anchor), the second the subset
      // sitting in the queue waiting to be replayed. "open · parked" made them
      // look like the same number twice — which, on an install where they are
      // equal, is exactly how it read.
      addCounter(foot, "still unhealed", series.anchor);
      var parked = [series.stillOpen];
      // Same rule as the anchor: the cache-served summary is a floor only while
      // the window is a sample. Over a whole window it is merely the older of two
      // readings of the same number.
      if (!series.whole && isReported(overview.pending)) { parked.push(overview.pending); }
      addCounter(foot, "awaiting replay", Math.max.apply(null, parked));
      // The label states the span it actually covers: a heal count from a
      // 7-minute window must not wear a 24-hour label.
      var summaryHealed = isReported(activity.resolved_24h) ? activity.resolved_24h : null;
      if (summaryHealed !== null && summaryHealed >= series.healedInWindow) {
        addCounter(foot, "healed 24 h", summaryHealed);
      } else {
        addCounter(foot, "healed in window", series.healedInWindow);
      }
    }
    // Deliberately OUTSIDE the window guard: an operator who has healed
    // everything has no window to draw, and that is the exact moment
    // "replayed 47" is most worth showing.
    addHealingCounters(foot);
  }

  // These two read a process-local, since-boot counter rather than shared
  // state, so a zero means one of three things — this process replayed
  // nothing, another process did the replaying, or this process restarted —
  // and nothing on this screen can tell them apart. The counters are monotone,
  // so any value above zero is true whichever of the three holds; the zero is
  // the only unverifiable claim, so it is never drawn. An install that has
  // genuinely healed nothing therefore shows four counters instead of five,
  // and the caption's scope sentence — rendered whenever the source answered
  // at all — is what separates "live source, nothing to report" from "no
  // source".
  function addHealingCounters(foot) {
    var counters = (healingSummary && healingSummary.counters) || {};
    if (counters.replayed > 0) {
      addCounter(foot, "replayed", counters.replayed);
    }
    if (counters.humans_paged > 0) {
      addCounter(foot, "humans paged", counters.humans_paged);
    }
  }

  // Never "today" — the counters start at process boot, not at midnight.
  function healingCaptionPart() {
    if (!healingSummary) { return ""; }
    var t = Date.parse(healingSummary.since);
    if (isNaN(t)) { return ""; }
    return "replay/paged counters: this process, since " + clockOf(t);
  }

  // Joined in describeRow, never inside a describer: DESCRIBERS entries are
  // pure functions of their OWN row's status payload, and /healing/summary is
  // not that payload.
  function healingRowToken(panelId) {
    var latency = (healingSummary && healingSummary.latency) || {};
    if (panelId === "dashboard") {
      // "app" is load-bearing. This measures the protected application's HTTP
      // endpoints, not this row's own subject, so a bare "p95 1.8 s" beside
      // "3 awaiting heal" would read as healing latency and be false. The
      // token ships with the prefix or not at all.
      return isReported(latency.http_p95_seconds)
        ? "app p95 " + secondsToken(latency.http_p95_seconds) : "";
    }
    if (panelId === "dlq") {
      if (isReported(latency.dlq_replay_p95_seconds)) {
        return "replay p95 " + secondsToken(latency.dlq_replay_p95_seconds);
      }
      // A different operation, so a different label: the store timing never
      // inherits the replay one's name.
      if (isReported(latency.dlq_store_p95_seconds)) {
        return "store p95 " + secondsToken(latency.dlq_store_p95_seconds);
      }
    }
    return "";
  }
  function secondsToken(seconds) {
    if (seconds < 1) { return Math.round(seconds * 1000) + " ms"; }
    return (Math.round(seconds * 10) / 10) + " s";
  }

  function addCounter(foot, label, value) {
    var slot = el("span");
    slot.appendChild(document.createTextNode(label + " "));
    slot.appendChild(el("b", null, String(value)));
    foot.appendChild(slot);
  }

  function init() {
    // Informational entitlement banner (D8) — non-gating.
    if (window.__BALDUR_ENTITLEMENT__ === "invalid") {
      var banner = document.getElementById("banner");
      banner.style.display = "block";
      banner.textContent =
        "PRO license expired or invalid — PRO features keep running until the " +
        "next restart, then deactivate. Renew on the billing surface.";
    }

    var keyInput = document.getElementById("admin-key");
    keyInput.value = getKey();
    document.getElementById("save-key").addEventListener("click", function () {
      setKey(keyInput.value.trim());
      refreshAll();
    });

    document.getElementById("modal-cancel").addEventListener("click", closeModal);
    document.getElementById("modal-confirm").addEventListener("click",
      runPendingAction);

    // One always-on display ticker for every age token on the page. Each
    // element may carry its own formatter (_fmt); with none it keeps the
    // original "updated Xs ago" shape, so every existing call site is
    // unchanged. One timer, one loop, several output shapes — and it never
    // fetches, so it cannot interleave with anything.
    setInterval(function () {
      var spans = document.getElementsByClassName("updated");
      for (var i = 0; i < spans.length; i++) {
        if (spans[i]._t) {
          spans[i].textContent = spans[i]._fmt
            ? spans[i]._fmt(spans[i]._t)
            : "updated " + relAgo(spans[i]._t);
        }
      }
    }, 5000);

    // Wall clock (display only). The confirmed design pairs it with a "live"
    // marker; auto-refresh ships OFF, so "live" would be a false claim on a
    // default console — the age tokens state the real thing instead.
    var clock = document.getElementById("clock");
    function tickClock() {
      clock.textContent = clockOf(Date.now()) + " " + tzSuffix();
    }
    tickClock();
    setInterval(tickClock, 1000);

    // Header auto-refresh toggle: body-only refresh of every panel row on an
    // interval (off by default; admin traffic is <1 RPS).
    var auto = document.getElementById("autorefresh-toggle");
    auto.addEventListener("change", function () {
      if (autoRefreshTimer) {
        clearInterval(autoRefreshTimer);
        autoRefreshTimer = null;
      }
      if (auto.checked) {
        autoRefreshTimer = setInterval(function () {
          panelRefreshers.forEach(function (fn) { fn(); });
          refreshLedger();
          refreshHealing();
        }, 15000);
      }
    });

    refreshAll();
  }

  function refreshAll() {
    var attention = document.getElementById("attention");
    var system = document.getElementById("system-rows");
    attention.textContent = "";
    system.textContent = "";
    panelRefreshers = [];        // repopulated below
    HEALTH = {};                 // repopulated as each row's status resolves
    ROWS = [];
    ROW_BY_KEY = {};
    LAST_PLACEMENT = "";
    BULKHEAD_REJECTED_SEEN = {}; // no previous sample -> no false rejection alarm
    PANELS.filter(panelVisible).forEach(function (p) {
      var row = buildPanelRow(p);
      ROWS.push(row);
      ROW_BY_KEY[row.key] = row;
      // Body-only refresher for the header auto-refresh toggle — never rebuilds
      // an open drill-down, so it won't disrupt active triage.
      panelRefreshers.push(function () { loadPanel(p, row); });
    });
    // Every row boots into System and the verdict shows its loading state:
    // nothing has answered yet, so there is no verdict to render.
    placeRows();
    renderTriage();
    ROWS.forEach(function (row) { loadPanel(row.panel, row); });
    refreshLedger(true);
    refreshHealing();
  }

  init();
  </script>
</body>
</html>
