# Baldur Prometheus Alert Rules
#
# Import into your Prometheus configuration:
#   rule_files:
#     - "baldur-alerts.yml"

groups:
  # =========================================================================
  # DLQ (Dead Letter Queue) Alerts
  # =========================================================================
  - name: dlq_alerts
    interval: 30s
    # -----------------------------------------------------------------------
    # Why these rules read `max(max_over_time(baldur_dlq_items_by_status{
    # status="pending"}[2m]))` and not `sum(baldur_dlq_pending_count)`:
    #
    # (a) Source. `baldur_dlq_items_by_status{status="pending"}` is the
    #     repository's O(1) pending count (a ZCARD / GROUP BY / index length).
    #     `baldur_dlq_pending_count` is a per-domain breakdown produced by an
    #     O(pending) scan that silently under-reports (undecodable entries are
    #     skipped), carries a domain axis whose label set differs per process,
    #     and is absent for domains a given worker has never served. It stays
    #     exported as a DIAGNOSTIC surface — use it to attribute a backlog, not
    #     to page on one.
    # (b) `max`, not `sum`. The pending total is repository-global but exported
    #     per process, so summing reporters multiplies the backlog by the
    #     number of scraped workers. `max` is also the safe-direction
    #     aggregator: a stale-high reporter extends an alert, never un-pages.
    #     On the memory backend the DLQ is genuinely per process, so `max`
    #     reports the largest single worker's backlog, not the fleet total.
    # (c) `max_over_time([2m])`. Exposition is per process: behind one scrape
    #     target, consecutive samples come from different workers, each up to
    #     one collection interval + jitter stale, and a just-restarted worker
    #     publishes no sample at all until its first tick. Taking the highest
    #     value in a short window turns both into a bounded lag in the safe
    #     direction (an alert resolves late, never early).
    #
    # Interval coupling — all three values below are tied to
    # BALDUR_METRICS_COLLECTION_INTERVAL_SECONDS (default 60s). Raising the
    # collection interval REQUIRES raising them in step:
    #   * this file's `[2m]` windows          -> keep >= 2x the interval
    #   * BaldurMetricCollectionStale `> 300` -> keep >= 5x the interval
    #   * its `[5m]` lookback                 -> keep >= the 300s threshold
    # -----------------------------------------------------------------------
    rules:
      - alert: DLQHighPendingCount
        expr: max(max_over_time(baldur_dlq_items_by_status{status="pending"}[2m])) > 50
        for: 5m
        labels:
          severity: warning
          category: dlq
        annotations:
          summary: "DLQ pending count elevated"
          description: "DLQ has {{ $value }} pending items. (threshold: 50) Per-domain attribution: baldur_dlq_pending_count, or the DLQ admin API."
          runbook_url: "https://docs.example.com/runbooks/dlq-high-pending"
          dashboard_url: "/d/baldur-operations/baldur-operations"

      - alert: DLQCriticalPendingCount
        expr: max(max_over_time(baldur_dlq_items_by_status{status="pending"}[2m])) > 100
        for: 3m
        labels:
          severity: critical
          category: dlq
        annotations:
          summary: "DLQ pending count critical"
          description: "DLQ has {{ $value }} pending items. Immediate investigation required. Per-domain attribution: baldur_dlq_pending_count, or the DLQ admin API."
          runbook_url: "https://docs.example.com/runbooks/dlq-critical"
          dashboard_url: "/d/baldur-operations/baldur-operations"

      - alert: DLQSpikeDetected
        expr: |
          (
            max(max_over_time(baldur_dlq_items_by_status{status="pending"}[2m]))
            /
            max(max_over_time(baldur_dlq_items_by_status{status="pending"}[2m] offset 5m))
          ) > 2
        for: 2m
        labels:
          severity: warning
          category: dlq
        annotations:
          summary: "DLQ spike detected"
          description: "DLQ pending items increased {{ $value | printf \"%.1f\" }}x in 5 minutes."

      # Dead man's switch for the per-process gauge collector. Every serving
      # process emits this heartbeat when it successfully refreshes the DLQ
      # status family — the family the three rules above page on — so a stalled
      # collector cannot leave those rules evaluating a frozen number in
      # silence. It deliberately does NOT track the per-domain breakdown: the
      # Redis adapter fails that scan open at outage scale while the paged
      # number stays perfectly fresh, and paging on it would stack a false
      # "collection stale" critical onto every large-backlog incident.
      #
      # max_over_time takes the freshest heartbeat behind the target, so the
      # rule means what it says — EVERY collecting process here has stopped —
      # instead of flapping on whichever worker answered the scrape. That also
      # means it cannot detect one dead worker among healthy siblings; for
      # per-worker thread death use baldur_daemon_worker_alive /
      # baldur_daemon_worker_last_heartbeat_age_seconds{name="domain_gauge_updater"}.
      - alert: BaldurMetricCollectionStale
        expr: time() - max_over_time(baldur_heartbeat_timestamp_seconds{component="metric_collection"}[5m]) > 300
        for: 0m
        labels:
          severity: warning
          category: metrics
        annotations:
          summary: "Baldur metric collection has stopped"
          description: "No successful DLQ gauge collection on {{ $labels.instance }} for over 5 minutes. The DLQ backlog alerts are evaluating a frozen value."
          runbook_url: "https://docs.example.com/runbooks/metric-collection-stale"

      # Uncomment on deployments that run with metric collection ENABLED (the
      # default). Fires for any scraped target that is up but exports no
      # collection heartbeat at all — the one failure this file cannot
      # otherwise see, because a target whose collector never started has no
      # series for the rule above to evaluate, and baldur_up == 1 keeps the
      # BaldurMetricsDown / BaldurMetricsAbsent rules green. Left commented
      # because it fires on every target of a deployment that sets
      # BALDUR_METRICS_ENABLED=false on purpose.
      # - alert: BaldurMetricCollectionAbsent
      #   expr: baldur_up == 1 unless on(instance, job) baldur_heartbeat_timestamp_seconds{component="metric_collection"}
      #   for: 10m
      #   labels:
      #     severity: warning
      #     category: metrics
      #   annotations:
      #     summary: "Baldur target exports no metric-collection heartbeat"
      #     description: "{{ $labels.instance }} is up but its gauge collector never started, so the DLQ backlog alerts have no series to evaluate there."

  # =========================================================================
  # Circuit Breaker Alerts
  # =========================================================================
  - name: circuit_breaker_alerts
    interval: 15s
    rules:
      - alert: CircuitBreakerOpen
        expr: baldur_circuit_breaker_state == 1
        for: 1m
        labels:
          severity: critical
          category: circuit_breaker
        annotations:
          summary: "Circuit Breaker OPEN"
          description: "{{ $labels.service }} Circuit Breaker is in OPEN state. Possible external service failure."
          runbook_url: "https://docs.example.com/runbooks/circuit-breaker-open"
          dashboard_url: "/d/baldur-overview/baldur-overview"

      - alert: CircuitBreakerHalfOpen
        expr: baldur_circuit_breaker_state == 2
        for: 5m
        labels:
          severity: warning
          category: circuit_breaker
        annotations:
          summary: "Circuit Breaker Half-Open for 5+ minutes"
          description: "{{ $labels.service }} has been in Half-Open state for over 5 minutes."

      - alert: CircuitBreakerTrippingRepeatedly
        expr: increase(baldur_circuit_breaker_trips_total[15m]) > 3
        for: 1m
        labels:
          severity: warning
          category: circuit_breaker
        annotations:
          summary: "Circuit Breaker tripping repeatedly"
          description: "{{ $labels.service }} circuit breaker tripped to OPEN {{ $value | printf \"%.0f\" }} time(s) in 15 minutes."

  # =========================================================================
  # Retry Alerts
  # =========================================================================
  - name: retry_alerts
    interval: 30s
    # The two protected-call rules below (RetryPressureHigh,
    # ProtectedCallFailureRateHigh) both read the protected-call layer, but on
    # different populations, and each floors its own. TaskFailureRateHigh
    # applies the same shape to the task-queue layer's series. Four things to
    # know before editing:
    #
    # 1. The `increase(...) > 10` leg is a MINIMUM SAMPLE SIZE requirement, not
    #    a traffic floor. Do not delete it and do not turn it back into a
    #    `rate(...) > N` volume gate: a ratio is not a signal below ~10 samples,
    #    and without the leg a single retried call in an otherwise idle domain
    #    reads full pressure and holds `for: 5m` for as long as the sample sits
    #    in the range window. (`increase` may extrapolate to a fractional count;
    #    the `> 10` comparison handles that with no special-casing.) A
    #    rate-based floor instead makes firing depend on adopter volume and
    #    permanently blinds low-volume domains, which are exactly the shape a
    #    single-service deployment has.
    #
    # 2. `by (domain)` pinpoints the failing dependency. The first two rules
    #    read protected-call series ONLY: a Baldur-protected call running
    #    inside a Celery task records the protected call here and the task's own
    #    resolution on `baldur_task_attempts_distribution` /
    #    `baldur_task_outcomes_total`, which TaskFailureRateHigh below reads. The
    #    two layers each keep their own denominator, so no per-layer naming
    #    workaround is needed.
    #
    # 3. RetryPressureHigh reads STARTED attempts, not resolved calls, and that
    #    is the point. The attempts histogram takes exactly one observation per
    #    sequence, at its terminal, so a storm whose sequences sit asleep in
    #    backoff or in an honored `Retry-After` cooldown (which can run to an
    #    hour) does not move it at all — the alert built to catch a retry storm
    #    was blind for the duration of the storm and only lit up once the storm
    #    resolved. `baldur_retry_attempts_started_total` increments at attempt
    #    admission, before any wait, so pressure is readable while the storm is
    #    still in flight. Its sample floor therefore counts ATTEMPTS while
    #    ProtectedCallFailureRateHigh's counts RESOLUTIONS: each floor guards
    #    its own ratio and neither gates the other. The histogram is unchanged
    #    and still answers the other question — how many attempts did resolved
    #    calls take.
    #
    # 4. Topology labels: on a global-view Prometheus (Thanos/Cortex) add your
    #    cluster/env labels to BOTH the `by (...)` groupings AND the
    #    `and on (...)` join — a `by (domain)` alone merges clusters there.
    #    Those labels are attached at federation/remote-write time, so they are
    #    absent from locally-scraped series and the rules ship without them.
    rules:
      # Threshold source: 0.33 is the attempt-denominator equivalent of this
      # rule's previously approved sensitivity ("on average every second
      # resolved call needs an extra attempt"): extra-per-resolution 0.5 ->
      # retries-per-attempt 0.5/1.5 = 1/3. Units and timeliness changed here;
      # sensitivity deliberately did not. For calibration context, the
      # framework's own Self-DDoS enforcement bound (AdaptiveRetryBudget's
      # max_retry_ratio) is 0.10 in these same units.
      - alert: RetryPressureHigh
        expr: |
          (
            sum by (domain) (rate(baldur_retry_attempts_started_total{is_retry="true",is_synthetic!="true"}[5m]))
            /
            sum by (domain) (rate(baldur_retry_attempts_started_total{is_synthetic!="true"}[5m]))
          ) > 0.33
          and on (domain)
          sum by (domain) (increase(baldur_retry_attempts_started_total{is_synthetic!="true"}[5m])) > 10
        for: 5m
        labels:
          severity: warning
          category: retry
        annotations:
          summary: "Retry pressure high"
          description: "{{ $labels.domain }} retry share of started attempts is {{ $value | humanizePercentage }}. (threshold: 33%)"

      - alert: ProtectedCallFailureRateHigh
        expr: |
          (
            sum by (domain) (rate(baldur_retry_outcomes_total{outcome!~"success|retry",is_synthetic!="true"}[5m]))
            /
            sum by (domain) (rate(baldur_retry_attempts_distribution_count{is_synthetic!="true"}[5m]))
          ) > 0.2
          and on (domain)
          sum by (domain) (increase(baldur_retry_attempts_distribution_count{is_synthetic!="true"}[5m])) > 10
        for: 5m
        labels:
          severity: warning
          category: retry
        annotations:
          summary: "Protected call failure rate high"
          description: "{{ $labels.domain }} terminal failure share is {{ $value | humanizePercentage }}. (threshold: 20%)"

      # Task-queue counterpart of ProtectedCallFailureRateHigh, on the task
      # layer's own series. `record_task_attempt` writes both legs in one call
      # and is the only writer of either, so numerator and denominator can
      # never drift apart. The task outcome vocabulary is exactly
      # success / failure, so `outcome!="success"` is exhaustive — the
      # per-retry signal lives in its own counter, not here.
      - alert: TaskFailureRateHigh
        expr: |
          (
            sum by (domain) (rate(baldur_task_outcomes_total{outcome!="success",is_synthetic!="true"}[5m]))
            /
            sum by (domain) (rate(baldur_task_attempts_distribution_count{is_synthetic!="true"}[5m]))
          ) > 0.2
          and on (domain)
          sum by (domain) (increase(baldur_task_attempts_distribution_count{is_synthetic!="true"}[5m])) > 10
        for: 5m
        labels:
          severity: warning
          category: retry
        annotations:
          summary: "Task-queue failure rate high"
          description: "{{ $labels.domain }} task terminal failure share is {{ $value | humanizePercentage }}. (threshold: 20%)"

  # =========================================================================
  # Rate Limit Coordination Alerts
  # =========================================================================
  - name: rate_limit_alerts
    interval: 30s
    rules:
      # Storage-degradation reading (coupled to the coordinator's recording
      # order): the 429 counter is recorded before every storage call, the
      # cooldown histogram only after the consecutive-429 increment succeeds.
      # A sustained gap therefore means the coordination store is rejecting
      # writes and the shared cooldown has degraded to per-worker state.
      # Re-check this rule if the recording order ever changes.
      #
      # The `or ... * 0` leg is load-bearing, not defensive noise: on a
      # cold start into an outage the cooldown series is never created, the
      # subtraction has no element to match, and a bare `A - B` would yield an
      # empty vector — silent in exactly the worst case. The `or` branch
      # supplies a zero-valued right side carrying the left side's labels.
      - alert: RateLimitStorageDegraded
        expr: |
          (
            sum by (key) (rate(baldur_rate_limit_429_total[5m]))
            -
            (
              sum by (key) (rate(baldur_rate_limit_cooldown_seconds_count[5m]))
              or
              sum by (key) (rate(baldur_rate_limit_429_total[5m])) * 0
            )
          ) > 0
          and on (key)
          sum by (key) (increase(baldur_rate_limit_429_total[5m])) > 10
        for: 5m
        labels:
          severity: warning
          category: rate_limit
        annotations:
          summary: "Rate-limit coordination store degraded"
          description: "{{ $labels.key }}: {{ $value | printf \"%.2f\" }} 429/sec with no cooldown recorded — coordination store write failures."

  # =========================================================================
  # Latency SLA Alerts
  # =========================================================================
  - name: latency_sla_alerts
    interval: 15s
    rules:
      - alert: LatencyP95SlaCritical
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le, service_name)
          ) * 1000 > 500
        for: 1m
        labels:
          severity: critical
          category: sla
        annotations:
          summary: "SLA Critical: P95 Latency exceeded"
          description: "{{ $labels.service_name }} P95 latency is {{ $value | printf \"%.0f\" }}ms. (threshold: 500ms)"
          dashboard_url: "/d/baldur-overview/baldur-overview"

      - alert: LatencyP95Warning
        expr: |
          histogram_quantile(0.95,
            sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le, service_name)
          ) * 1000 > 300
        for: 3m
        labels:
          severity: warning
          category: sla
        annotations:
          summary: "Latency warning: P95 response time increasing"
          description: "{{ $labels.service_name }} P95 latency is {{ $value | printf \"%.0f\" }}ms. (threshold: 300ms)"

      - alert: LatencyP99High
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le, service_name)
          ) * 1000 > 1000
        for: 5m
        labels:
          severity: warning
          category: sla
        annotations:
          summary: "P99 Latency high"
          description: "{{ $labels.service_name }} P99 latency is {{ $value | printf \"%.0f\" }}ms. (threshold: 1000ms)"

  # =========================================================================
  # Canary Rollout Alerts
  # =========================================================================
  - name: canary_alerts
    interval: 30s
    rules:
      - alert: CanaryGovernanceBypassUsed
        expr: increase(baldur_canary_governance_bypass_total[15m]) > 0
        for: 0m
        labels:
          severity: warning
          category: canary
        annotations:
          summary: "Canary governance Break Glass used"
          description: "{{ $labels.requested_by }} bypassed the canary governance gate {{ $value | printf \"%.0f\" }} time(s) in 15m. Auto-recovery resumes legitimately trip this; a post-incident review may be required."

  # =========================================================================
  # System Alerts
  # =========================================================================
  - name: system_alerts
    interval: 1m
    rules:
      # Scrape liveness keys off `baldur_up` — the label-less marker every
      # Baldur process exports — instead of a scrape job name. Baldur ships no
      # scrape config, so no job-name convention exists to pin a rule to, and a
      # single-framework selector matches an empty vector everywhere else.
      #
      # (a) The 6h lookback bounds how long a dead target keeps paging. Past it
      #     the join stops matching, so Alertmanager sends an affirmative
      #     RESOLVED while the target is still dead — BaldurMetricsAbsent below
      #     covers only the all-targets-gone case. Widen the window if that
      #     matters more to you than noise from decommissioned targets.
      # (b) Multi-service fleets can add a per-job specialization on top, e.g.
      #     `up{job="payments-api"} == 0`, without touching the rules below.
      # (c) Day 0: BaldurMetricsAbsent is an absence test over the whole TSDB,
      #     so loading these rules before any Baldur exporter is live pages
      #     immediately. That is intended — "supposed to report but never did"
      #     is exactly what it detects — but load the rules after the exporter,
      #     or drop that one rule while bringing a deployment up. Its `for: 5m`
      #     on top of the 5m lookback keeps a rolling restart from tripping it.
      # (d) Under dynamic service discovery (Kubernetes EndpointSlice / pod
      #     role) a dead target is removed from discovery rather than reported
      #     `up == 0`, so neither rule sees a single dead replica while its
      #     siblings keep reporting. Replica-level death detection there belongs
      #     to the orchestrator (kube-state-metrics, readiness probes).
      - alert: BaldurMetricsDown
        expr: up == 0 and on (job, instance) present_over_time(baldur_up[6h])
        for: 2m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "Baldur metrics collection failed"
          description: "Target {{ $labels.instance }} (job {{ $labels.job }}) exported Baldur metrics within the last 6h and is now unscrapable. Check service health."

      - alert: BaldurMetricsAbsent
        expr: absent_over_time(baldur_up[5m])
        for: 5m
        labels:
          severity: critical
          category: system
        annotations:
          summary: "No Baldur exporter is reporting"
          description: "No baldur_up sample arrived in 5m: every target is down at once, the scrape job was relabeled away, or metrics never initialized."

      - alert: RequestThroughputDrop
        expr: |
          (
            sum(rate(baldur_http_requests_total[5m]))
            /
            sum(rate(baldur_http_requests_total[5m] offset 1h))
          ) < 0.5
        for: 5m
        labels:
          severity: warning
          category: system
        annotations:
          summary: "Request throughput dropped"
          description: "Throughput is {{ $value | printf \"%.1f\" }}x compared to 1 hour ago."
