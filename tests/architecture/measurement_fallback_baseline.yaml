# Measurement-fallback verdict inventory — read by the fabrication-detector gate.
#
# One row per measurement-named field filled by a numeric literal inside a
# payload-assembly function. A row is not permission to fabricate: it records
# what the number actually is.
#
# Regenerate with scripts/derive_operator_surface.py. The unit list is derived
# from code and must never be edited by hand; the audited columns named under
# "Verdicts" below are preserved across regeneration, and every other column is
# re-derived each run.
#
# This is a verdict inventory, NOT a violation allowlist. A row that no longer
# matches a live unit FAILS its gate as an orphan rather than being silently
# accepted, because the audit's closing counts are taken over these rows — a
# stale row here inflates a count instead of forgiving a violation that stopped
# happening. Do not carry the allowlist file's silent-accept behaviour across.
#
# Audited columns here: verdict, ticket. `evidence` is the scanner's own
# file:lines and is re-derived every run — a note written into it is lost on the
# next regeneration; put it in `ticket` or the audit report instead.
#
# Verdicts:
#   real-producer   the producer provably always supplies the key, or the
#                   branch condition itself establishes the value
#   config-default  a configured parameter's default, not a measurement
#   out-of-surface  not an operator-visible value slot (log field, internal
#                   decision record, stub adapter)
#   honest-absent   the literal was replaced by an explicit absence
#   FABRICATED      a live lie; the ticket tracks it
#   cross-ref       another in-flight work item owns the disposition

