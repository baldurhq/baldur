# Operator-surface verdict inventory — read by the surface-inventory gate.
#
# One row per affordance-level unit: a console panel, a bespoke renderer's
# payload read, an operator input key, or a mutating control domain.
#
# Regenerate with scripts/derive_operator_surface.py. The unit list is derived
# from code and must never be edited by hand; the verdict, evidence and ticket
# columns are the audited part and are preserved across regeneration.
#
# This is a verdict inventory, NOT a violation allowlist. A row that no longer
# matches a live unit FAILS its gate as an orphan rather than being silently
# accepted, because the audit's closing counts are taken over these rows — a
# stale row here inflates a count instead of forgiving a violation that stopped
# happening. Do not carry the allowlist file's silent-accept behaviour across.
#
# Tier is derived from panel visibility (T1 = OSS-visible console surface and
# everything hanging off it, T2 = PRO console surface, T3 = no panel at all).
#
# Value verdicts (panel, renderer-key):
#   real-producer   a producer computes the value on every rendered path
#   honest-absent   the slot renders absence rather than a stand-in number
#   FABRICATED      rendered from nothing; the ticket tracks the fix
#   cross-ref       another in-flight work item owns the disposition
#   pending-tier    this tier has not been audited yet (never valid at T1)
#
# Control verdicts (route-domain, body-field):
#   consumer-reached  the write reaches something that behaves differently
#   DEAD-CONTROL      accepted, stored, audited, and acted on by nothing —
#                     including echo-only reads, which are not "reached"
#   cross-ref, pending-tier as above

